<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CommandOS V16 | 深度垂直版</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --sidebar: #151921;
            --panel: #222630;
            --input: #2f3442;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #e2e8f0;
            --text-sub: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        /* --- 布局 --- */
        .app-container { display: flex; width: 100%; height: 100%; }
        
        /* 侧边栏 */
        .sidebar {
            width: 250px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
            overflow-y: auto;
        }

        .brand {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent); }

        .menu-category { padding: 20px 20px 8px; font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        
        .menu-item {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-sub);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: rgba(59, 130, 246, 0.15); color: var(--accent); border-left-color: var(--accent); }
        .menu-item i { width: 16px; text-align: center; }

        /* 工作区 */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
            position: relative;
        }

        .topbar {
            height: 55px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg);
        }

        .model-selector select {
            background: var(--panel); color: white; border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
        }

        .scroll-area {
            flex: 1; overflow-y: auto; padding: 20px; max-width: 1000px; margin: 0 auto; width: 100%;
        }

        /* 上下文面板 */
        .context-panel {
            width: 280px;
            background: var(--sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 20px;
            overflow-y: auto;
        }

        /* --- 组件 --- */
        .card-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 15px; color: var(--text-sub); display: flex; justify-content: space-between; text-transform: uppercase; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group { position: relative; }
        
        label { display: block; margin-bottom: 6px; color: var(--text-sub); font-size: 0.8rem; }
        input, select, textarea {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; font-family: inherit; margin-bottom: 0;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #3b4050; }

        .magic-btn {
            position: absolute; right: 8px; top: 28px;
            background: transparent; border: none; color: var(--gold);
            cursor: pointer; font-size: 0.9rem; padding: 4px;
        }
        .magic-btn:hover { transform: scale(1.1); }

        .action-bar { display: flex; gap: 15px; align-items: center; margin-top: 10px; padding-bottom: 30px; }
        .btn-main {
            flex: 1; padding: 12px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }
        .btn-main:hover { background: var(--accent-hover); transform: translateY(-1px); }
        
        .switch-group { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 0.85rem; cursor: pointer; user-select: none; }
        .switch-group input { margin: 0; accent-color: var(--accent); }

        /* 结果展示 */
        .result-container { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .result-box {
            background: #000; border: 1px solid var(--border); border-radius: 8px;
            padding: 15px; font-family: 'Monaco', monospace; color: #10b981;
            font-size: 0.85rem; line-height: 1.5; min-height: 80px; white-space: pre-wrap; position: relative;
        }
        .ab-tag {
            position: absolute; top: 0; left: 0; background: var(--panel); 
            padding: 2px 8px; font-size: 0.7rem; border-bottom-right-radius: 6px; color: var(--text-sub); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
        }

        /* --- 特殊组件：上传区域 --- */
        .upload-zone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 20px;
            text-align: center; color: var(--text-sub); cursor: pointer;
            transition: 0.2s; background: rgba(0,0,0,0.2);
            margin-bottom: 15px; display: none; /* 默认隐藏 */
        }
        .upload-zone:hover { border-color: var(--accent); color: var(--accent); background: rgba(59, 130, 246, 0.05); }
        .upload-icon { font-size: 2rem; margin-bottom: 10px; }
        .file-name { margin-top: 10px; font-size: 0.8rem; color: var(--green); display: none; }

        /* 移动端适配 */
        .mobile-toggle { display: none; font-size: 1.2rem; color: white; cursor: pointer; }
        @media (max-width: 1024px) { .context-panel { display: none; } }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; height: 100%; transition: 0.3s; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .mobile-toggle { display: block; }
            .topbar { padding: 0 15px; }
            .scroll-area { padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="sidebar" id="sidebar">
            <div class="brand"><i class="fas fa-terminal"></i> Command<span>OS</span></div>
            
            <div class="menu-category">Generative Studio</div>
            <div class="menu-item active" onclick="loadTool('visual')"><i class="fas fa-camera"></i> 视觉 (Visual)</div>
            <div class="menu-item" onclick="loadTool('video')"><i class="fas fa-video"></i> 视频 (Video)</div>
            <div class="menu-item" onclick="loadTool('audio')"><i class="fas fa-music"></i> 音乐 (Audio)</div>
            <div class="menu-item" onclick="loadTool('text')"><i class="fas fa-pen-nib"></i> 写作 (Copy)</div>
            
            <div class="menu-category">Professional Matrix</div>
            <div class="menu-item" onclick="loadTool('email')"><i class="fas fa-envelope-open-text"></i> 外贸开发 (Sales)</div>
            <div class="menu-item" onclick="loadTool('academic')"><i class="fas fa-graduation-cap"></i> 学术科研 (Scholar)</div>
            <div class="menu-item" onclick="loadTool('xhs')"><i class="fab fa-instagram"></i> 小红书矩阵</div>
            <div class="menu-item" onclick="loadTool('tiktok')"><i class="fab fa-tiktok"></i> 抖音/TikTok</div>
            
            <div class="menu-category">Tools</div>
            <div class="menu-item" onclick="loadTool('reverse')"><i class="fas fa-upload"></i> 逆向工程 (Reverse)</div>
        </div>

        <div class="workspace">
            <div class="topbar">
                <div style="display:flex; gap:15px; align-items:center;">
                    <i class="fas fa-bars mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"></i>
                    <span style="font-weight:bold; font-size:1.1rem;" id="toolTitle">视觉指令台</span>
                </div>
                <div class="model-selector">
                    <select id="targetModel">
                        </select>
                </div>
            </div>

            <div class="scroll-area">
                
                <div id="uploadArea" class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-cloud-upload-alt upload-icon"></i>
                    <div>点击或拖拽上传图片</div>
                    <div style="font-size:0.75rem; opacity:0.7; margin-top:5px;">支持 JPG, PNG, WEBP</div>
                    <div id="fileNameDisplay" class="file-name"></div>
                    <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
                </div>

                <div id="dynamicForm" class="form-grid"></div>

                <div class="action-bar">
                    <div class="switch-group">
                        <input type="checkbox" id="abTest"> <span>A/B 测试 (3版)</span>
                    </div>
                    <button class="btn-main" onclick="generate()">
                        <i class="fas fa-bolt"></i> 立即生成
                    </button>
                </div>

                <div class="card-title">
                    <span>Output Terminal</span>
                    <span style="font-size:0.75rem; cursor:pointer; color:var(--accent);" onclick="document.getElementById('resultContainer').innerHTML=''">Clear</span>
                </div>
                <div id="resultContainer" class="result-container"></div>
            </div>
        </div>

        <div class="context-panel">
            <div class="card-title">🧬 品牌 DNA (Memory)</div>
            <p style="font-size:0.8rem; color:var(--text-sub); margin-bottom:15px;">垂直行业预设已加载。</p>
            
            <label>品牌/视觉主色</label>
            <input type="text" id="dnaColor" placeholder="e.g. #FF5733, Tech Blue">

            <label>目标受众</label>
            <input type="text" id="dnaTarget" placeholder="e.g. 欧美B端客户">

            <label>语气基调</label>
            <select id="dnaTone">
                <option value="">-- Default --</option>
                <option value="Professional">专业严谨 (Professional)</option>
                <option value="Urgent">紧迫感 (Urgent)</option>
                <option value="Friendly">亲和 (Friendly)</option>
                <option value="Academic">学术 (Academic)</option>
            </select>

            <label>负向/禁用词</label>
            <textarea id="dnaNegative" placeholder="e.g. text, watermark..." style="height:60px;"></textarea>
        </div>

    </div>

    <script>
        // === 核心数据配置 ===
        const tools = {
            visual: {
                title: "Visual Director (视觉)",
                models: ['Midjourney V6', 'Niji V6', 'Stable Diffusion XL', 'DALL-E 3'],
                inputs: [
                    { id: 'subject', label: '画面主体', type: 'text', placeholder: 'e.g. 赛博朋克风格的猫', magic: true },
                    { id: 'style', label: '艺术风格', type: 'select', options: ['Photorealistic', 'Cyberpunk', 'Anime', '3D Render', 'UE5', 'Oil Painting', 'Watercolor'] },
                    { id: 'shot', label: '构图/运镜', type: 'select', options: ['Wide Angle', 'Telephoto', 'Drone View', 'Macro', 'Isometric'] },
                    { id: 'light', label: '布光', type: 'select', options: ['Cinematic', 'Natural', 'Neon', 'Rembrandt', 'Volumetric'] }
                ]
            },
            video: {
                title: "Video Director (视频)",
                models: ['Runway Gen-2', 'Pika Labs', 'Sora', 'Stable Video'],
                inputs: [
                    { id: 'subject', label: '视频内容', type: 'text', placeholder: 'e.g. 海浪拍打礁石' },
                    { id: 'camera', label: '运镜方式', type: 'select', options: ['Pan Right', 'Pan Left', 'Zoom In', 'Zoom Out', 'Orbit', 'FPV'] },
                    { id: 'motion', label: '动态幅度', type: 'select', options: ['Low', 'Medium', 'High', 'Speed Ramp'] },
                    { id: 'fps', label: '帧率', type: 'select', options: ['24fps (Cinematic)', '30fps', '60fps'] }
                ]
            },
            audio: {
                title: "Music Producer (音乐)",
                models: ['Suno V3', 'Udio'],
                inputs: [
                    { id: 'genre', label: '流派', type: 'select', options: ['Pop', 'K-pop', 'Rock', 'Jazz', 'Hip Hop', 'Phonk', 'EDM', 'Epic Orchestral'] },
                    { id: 'mood', label: '情绪', type: 'select', options: ['Happy', 'Sad', 'Energetic', 'Chill', 'Dark'] },
                    { id: 'vocal', label: '人声', type: 'select', options: ['Female', 'Male', 'Duet', 'Instrumental'] }
                ]
            },
            email: {
                title: "Global Sales (外贸开发)",
                models: ['GPT-4o (Sales)', 'Claude 3 Haiku'],
                inputs: [
                    { id: 'product', label: '推销产品', type: 'text', placeholder: 'e.g. Solar Panels' },
                    { id: 'role', label: '收件人职位', type: 'select', options: ['CEO / Owner', 'Purchasing Manager (采购)', 'Product Manager', 'Marketing Director', 'General Inquiry'] },
                    { id: 'stage', label: '营销阶段', type: 'select', options: ['Cold Outreach (首封开发)', 'Follow Up 1 (初次跟进)', 'Proposal (发送报价)', 'Re-engagement (激活僵尸粉)', 'Last Attempt (最后尝试)'] },
                    { id: 'framework', label: '营销框架', type: 'select', options: ['AIDA (Attention-Interest)', 'BAB (Before-After-Bridge)', 'PAS (Problem-Solve)', 'Direct Pitch (开门见山)'] },
                    { id: 'cta', label: '行动号召 (CTA)', type: 'select', options: ['Book a Call (约会议)', 'Reply for Info (回复要资料)', 'Request Sample (索取样品)', 'Visit Website (访问网站)'] },
                    { id: 'lang', label: '目标语言', type: 'select', options: ['English (US)', 'English (UK)', 'Spanish', 'French', 'German', 'Japanese', 'Arabic'] }
                ]
            },
            academic: {
                title: "Academic Scholar (学术科研)",
                models: ['Claude 3.5 Sonnet', 'GPT-4o (Academic)'],
                inputs: [
                    { id: 'content', label: '论文段落/摘要', type: 'textarea', placeholder: '在此粘贴需要润色或降重的文本...', height: '120px' },
                    { id: 'field', label: '研究领域', type: 'text', placeholder: 'e.g. Neuroscience, Machine Learning' },
                    { id: 'target', label: '投稿目标/风格', type: 'select', options: ['IEEE Standard', 'Nature/Science Style', 'APA Format', 'MLA Style', 'General Academic'] },
                    { id: 'goal', label: '优化目标', type: 'select', options: ['降重 (Reduce Repetition)', '深度润色 (Polish Grammar)', '逻辑增强 (Enhance Logic)', '学术化 (Make Academic)', '中式英语矫正 (Fix Chinglish)'] },
                    { id: 'section', label: '所属部分', type: 'select', options: ['Abstract', 'Introduction', 'Methodology', 'Results', 'Discussion', 'Conclusion'] }
                ]
            },
            reverse: {
                title: "Reverse Engineering (逆向工程)",
                models: ['GPT-4 Vision', 'Claude 3 Opus'],
                inputs: [
                    { id: 'desc', label: '补充描述 (可选)', type: 'textarea', placeholder: '例如：我想模仿这张图的灯光，但把猫换成狗...', height: '80px' },
                    { id: 'mode', label: '分析模式', type: 'select', options: ['Extract Visual Prompts (提取画面)', 'Analyze Layout (分析构图)', 'Extract Color Palette (提取配色)', 'Full Analysis (全量分析)'] }
                ]
            },
            text: { title: "Copywriter (写作)", models:['GPT-4'], inputs: [{id:'topic',label:'主题',type:'text'}, {id:'framework',label:'框架',type:'select',options:['AIDA','PAS','First Principles']}]},
            xhs: { title: "小红书矩阵", models:['Claude 3'], inputs: [{id:'topic',label:'选题',type:'text'}, {id:'niche',label:'赛道',type:'select',options:['美妆','数码','穿搭','美食']}]},
            tiktok: { title: "抖音脚本", models:['GPT-4'], inputs: [{id:'topic',label:'主题',type:'text'}, {id:'hook',label:'开头',type:'select',options:['视觉奇观','反差','提问']}]}
        };

        let currentTool = 'visual';

        window.onload = () => loadTool('visual');

        function loadTool(key) {
            currentTool = key;
            const data = tools[key];
            
            document.getElementById('toolTitle').innerText = data.title;
            document.getElementById('targetModel').innerHTML = data.models.map(m => `<option>${m}</option>`).join('');

            // 处理上传区域显示
            const uploadArea = document.getElementById('uploadArea');
            if (key === 'reverse') {
                uploadArea.style.display = 'block';
            } else {
                uploadArea.style.display = 'none';
            }

            // 渲染表单
            const container = document.getElementById('dynamicForm');
            container.innerHTML = '';
            
            data.inputs.forEach(field => {
                const div = document.createElement('div');
                div.className = 'input-group';
                
                let inputHtml = '';
                if(field.type === 'select') {
                    const opts = field.options.map(o => `<option>${o}</option>`).join('');
                    inputHtml = `<select id="f_${field.id}">${opts}</select>`;
                } else if (field.type === 'textarea') {
                    inputHtml = `<textarea id="f_${field.id}" placeholder="${field.placeholder || ''}" style="height:${field.height || '100px'}"></textarea>`;
                } else {
                    inputHtml = `<input type="text" id="f_${field.id}" placeholder="${field.placeholder || ''}">`;
                }

                let magicBtn = '';
                if(field.magic) {
                    magicBtn = `<button class="magic-btn" onclick="magicExpand('f_${field.id}')" title="AI扩写"><i class="fas fa-magic"></i></button>`;
                }

                div.innerHTML = `<label>${field.label}</label>${inputHtml}${magicBtn}`;
                container.appendChild(div);
            });

            // 菜单状态
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            const items = document.querySelectorAll('.menu-item');
            items.forEach(item => {
                if(item.getAttribute('onclick').includes(key)) item.classList.add('active');
            });
            
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        // 文件处理 (模拟)
        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                const display = document.getElementById('fileNameDisplay');
                display.style.display = 'block';
                display.innerText = `✅ 已加载: ${file.name} (Ready for Analysis)`;
                // 这里可以添加真实的图片预览逻辑，如果需要的话
            }
        }

        // 核心生成逻辑
        function generate() {
            const model = document.getElementById('targetModel').value;
            const isAB = document.getElementById('abTest').checked;
            const toolData = tools[currentTool];
            const fileInput = document.getElementById('fileInput');
            
            const inputs = {};
            toolData.inputs.forEach(f => {
                inputs[f.id] = document.getElementById(`f_${f.id}`).value;
            });

            // 逆向工程特殊逻辑
            if (currentTool === 'reverse' && fileInput.files.length > 0) {
                simulateVisionAnalysis(fileInput.files[0].name, model, inputs);
                return;
            }

            // 常规生成
            const container = document.getElementById('resultContainer');
            container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;"><i class="fas fa-spinner fa-spin"></i> Generating...</div>';

            setTimeout(() => {
                container.innerHTML = ''; 
                const versions = isAB ? ['Version A', 'Version B', 'Version C'] : ['Result'];
                
                versions.forEach(ver => {
                    const prompt = buildPrompt(currentTool, model, inputs, ver);
                    const box = document.createElement('div');
                    box.className = 'result-box';
                    box.innerHTML = `<div class="ab-tag">${ver}</div>${prompt} <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                    container.appendChild(box);
                });
            }, 800);
        }

        // 模拟 Vision 分析过程
        function simulateVisionAnalysis(filename, model, inputs) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            
            const steps = [
                `🔍 Uploading ${filename} to ${model}...`,
                `🧠 Analyzing pixel data...`,
                `🎨 Detecting style: Cyberpunk / Neon...`,
                `📐 Extracting composition vectors...`,
                `✨ Generating prompt structure...`
            ];

            let stepIndex = 0;
            const box = document.createElement('div');
            box.className = 'result-box';
            box.style.color = 'var(--text-sub)';
            container.appendChild(box);

            const interval = setInterval(() => {
                if (stepIndex >= steps.length) {
                    clearInterval(interval);
                    box.style.color = '#10b981';
                    box.innerHTML = `<div class="ab-tag">Analysis Result</div>/imagine prompt: highly detailed photograph of a futuristic street, neon blue and pink lighting, wet pavement reflection, cinematic atmosphere, shot on 35mm lens, f/1.8, high contrast --v 6.0 --ar 16:9\n\n(Derived from: ${filename})`;
                    box.innerHTML += ` <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                } else {
                    box.innerText = steps[stepIndex];
                    stepIndex++;
                }
            }, 600);
        }

        function buildPrompt(toolKey, model, inputs, ver) {
            // 获取 DNA
            const dna = {
                tone: document.getElementById('dnaTone').value,
                target: document.getElementById('dnaTarget').value
            };

            let res = "";
            
            if (toolKey === 'email') {
                res = `Subject: [Relevant Hook regarding ${inputs.product}]\n\nHi [Name],\n\n(Context: Writing to ${inputs.role}, Stage: ${inputs.stage})\n\n[Opening using ${inputs.framework} framework...]\n\n[Value Proposition: ${inputs.product} benefits for ${dna.target || 'your company'}]\n\n[CTA: ${inputs.cta}]\n\nBest,\n[Your Name]`;
            } else if (toolKey === 'academic') {
                res = `[Task: ${inputs.goal} for ${inputs.section}]\n[Style: ${inputs.target}]\n[Field: ${inputs.field}]\n\nRevised Text:\n(Here AI will output the polished version of: "${inputs.content.substring(0, 20)}..." with improved academic tone and ${inputs.target} formatting.)`;
            } else if (toolKey === 'visual') {
                res = `/imagine prompt: ${Object.values(inputs).join(', ')} --v 6.0`;
            } else {
                res = `### Task: ${tools[toolKey].title}\n### Inputs: ${JSON.stringify(inputs)}\n### Model: ${model}`;
            }
            return res;
        }

        function copyText(icon) {
            navigator.clipboard.writeText(icon.parentElement.innerText.replace(icon.previousElementSibling?.innerText || "", "").trim());
            alert("Copied!");
        }

        function magicExpand(id) {
