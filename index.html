<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CommandOS V28 | 文本矩阵增强版</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --sidebar: #151921;
            --panel: #222630;
            --input: #2f3442;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #e2e8f0;
            --text-sub: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
            --purple: #8b5cf6;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        /* --- 布局 --- */
        .app-container { display: flex; width: 100%; height: 100%; }
        
        .sidebar {
            width: 260px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
            overflow-y: auto;
        }

        .brand {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent); }

        .menu-category { padding: 20px 20px 8px; font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        
        .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-sub);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: rgba(59, 130, 246, 0.15); color: var(--accent); border-left-color: var(--accent); }
        .menu-item i { width: 18px; text-align: center; }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
            position: relative;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: var(--bg);
        }

        .model-selector select {
            background: var(--panel); color: white; border: 1px solid var(--border);
            padding: 8px 15px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
        }

        .scroll-area {
            flex: 1; overflow-y: auto; padding: 30px; max-width: 1000px; margin: 0 auto; width: 100%;
        }

        .card-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 20px; color: var(--text-sub); display: flex; justify-content: space-between; text-transform: uppercase; align-items: center;}
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group { position: relative; }
        
        label { display: block; margin-bottom: 8px; color: var(--text-sub); font-size: 0.85rem; font-weight: 500; }
        input, select, textarea {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            color: white; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-family: inherit; margin-bottom: 0;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #3b4050; }

        /* 特殊：Library 下拉菜单分组样式 */
        optgroup { font-style: normal; font-weight: bold; color: var(--gold); background: var(--sidebar); }
        option { color: white; padding: 5px; background: var(--input); }

        .magic-btn {
            position: absolute; right: 10px; top: 32px;
            background: transparent; border: none; color: var(--gold);
            cursor: pointer; font-size: 1rem; padding: 4px;
        }
        .magic-btn:hover { transform: scale(1.1); }

        .action-bar { display: flex; gap: 20px; align-items: center; margin-top: 10px; padding-bottom: 30px; }
        .btn-main {
            flex: 1; padding: 14px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2); font-size: 1rem;
        }
        .btn-main:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-main.purple { background: var(--purple); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2); }
        .btn-main.purple:hover { background: #7c3aed; }
        
        .switch-group { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 0.9rem; cursor: pointer; user-select: none; }
        .switch-group input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px;}

        .result-container { display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }
        .result-box {
            background: #000; border: 1px solid var(--border); border-radius: 8px;
            padding: 20px; font-family: 'Monaco', monospace; color: #10b981;
            font-size: 0.9rem; line-height: 1.6; min-height: 100px; white-space: pre-wrap; position: relative;
        }
        .ab-tag {
            position: absolute; top: 0; left: 0; background: var(--panel); 
            padding: 4px 10px; font-size: 0.75rem; border-bottom-right-radius: 6px; color: var(--text-sub); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
        }

        .upload-zone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 30px;
            text-align: center; color: var(--text-sub); cursor: pointer;
            transition: 0.2s; background: rgba(0,0,0,0.2);
            margin-bottom: 25px; display: none;
        }
        .upload-zone:hover { border-color: var(--accent); color: var(--accent); background: rgba(59, 130, 246, 0.05); }
        .file-name { margin-top: 10px; font-size: 0.85rem; color: var(--gold); display: none; font-weight: bold;}

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; height: 100%; transition: 0.3s; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .mobile-toggle { display: block; }
            .topbar { padding: 0 15px; }
            .scroll-area { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
        }
        .mobile-toggle { display: none; font-size: 1.2rem; color: white; cursor: pointer; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="sidebar" id="sidebar">
            <div class="brand"><i class="fas fa-terminal"></i> Command<span>OS</span></div>
            
            <div class="menu-category">Generative Studio</div>
            <div class="menu-item active" onclick="loadTool('visual')"><i class="fas fa-camera"></i> 视觉 (Visual)</div>
            <div class="menu-item" onclick="loadTool('video')"><i class="fas fa-video"></i> 视频 (Video)</div>
            <div class="menu-item" onclick="loadTool('audio')"><i class="fas fa-music"></i> 音乐 (Audio)</div>
            <div class="menu-item" onclick="loadTool('text')"><i class="fas fa-pen-nib"></i> 写作 (Copy)</div>
            
            <div class="menu-category">Professional Matrix</div>
            <div class="menu-item" onclick="loadTool('xhs')"><i class="fab fa-instagram"></i> 小红书矩阵</div>
            <div class="menu-item" onclick="loadTool('tiktok')"><i class="fab fa-tiktok"></i> 抖音/TikTok</div>
            <div class="menu-item" onclick="loadTool('academic')"><i class="fas fa-graduation-cap"></i> 学术科研 (Scholar)</div>
            <div class="menu-item" onclick="loadTool('email')"><i class="fas fa-envelope-open-text"></i> 外贸开发 (Sales)</div>
            
            <div class="menu-category">AI Resources</div>
            <div class="menu-item" onclick="loadTool('library')"><i class="fas fa-book"></i> 经典词库 (Library)</div>
            <div class="menu-item" onclick="loadTool('reverse')"><i class="fas fa-upload"></i> 逆向工程 (Reverse)</div>
        </div>

        <div class="workspace">
            <div class="topbar">
                <div style="display:flex; gap:15px; align-items:center;">
                    <i class="fas fa-bars mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"></i>
                    <span style="font-weight:bold; font-size:1.1rem;" id="toolTitle">视觉指令台</span>
                </div>
                <div class="model-selector">
                    <select id="targetModel">
                        </select>
                </div>
            </div>

            <div class="scroll-area">
                
                <div id="uploadArea" class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-cloud-upload-alt" style="font-size:2rem; margin-bottom:10px;"></i>
                    <div>点击或拖拽上传图片</div>
                    <div id="fileNameDisplay" class="file-name"></div>
                    <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
                </div>

                <div id="dynamicForm" class="form-grid"></div>

                <div class="action-bar">
                    <div class="switch-group" id="abTestGroup">
                        <input type="checkbox" id="abTest"> <span>A/B 测试 (3版)</span>
                    </div>
                    <button class="btn-main" id="actionBtn" onclick="generate()">
                        <i class="fas fa-bolt"></i> 立即生成
                    </button>
                </div>

                <div class="card-title">
                    <span>Output Terminal</span>
                    <span style="font-size:0.75rem; cursor:pointer; color:var(--accent);" onclick="document.getElementById('resultContainer').innerHTML=''">Clear</span>
                </div>
                <div id="resultContainer" class="result-container"></div>
            </div>
        </div>

    </div>

    <script>
        // === 1. 词库结构定义 (Grouping) ===
        const libraryGroups = {
            "🎨 视觉创作 (Visual Art)": {
                'MJ 摄影大师 (Portrait Master)': "/imagine prompt: extreme close-up portrait of [Subject], natural lighting, 85mm lens, f/1.8, detailed skin texture, cinematic atmosphere, neutral background, shot on Hasselblad X2D --v 6.0 --style raw",
                'MJ 极简 Logo (Minimalist Logo)': "/imagine prompt: minimalist vector logo of [Subject], negative space, geometric shapes, bauhaus style, white background, flat design, vector graphics --v 6.0 --no text shading details",
                'MJ 泡泡玛特风 (Pop Mart 3D)': "/imagine prompt: cute 3d pop mart character, [Subject], clay material, pastel colors, soft studio lighting, 3d render, c4d, octane render, blind box toy --v 6.0 --niji 6",
                'MJ 苹果风图标 (Apple 3D Icon)': "/imagine prompt: 3d glass icon of [Subject], apple design style, frosted glass, soft gradient, transparent, high gloss, macos big sur style, white background --v 6.0",
                'MJ 室内设计 (Interior Design)': "/imagine prompt: modern minimalist living room, beige tone, sunlight, indoor plants, architectural photography, high resolution, unspash style --v 6.0 --ar 16:9",
                'MJ 赛博朋克城市 (Cyberpunk City)': "/imagine prompt: futuristic cyberpunk city street, neon rain, flying cars, holograms, wet pavement reflection, night time, cinematic lighting --v 6.0 --ar 16:9",
                'MJ 矢量贴纸 (Vector Sticker)': "/imagine prompt: die-cut sticker of [Subject], white border, vector art, cute, flat color, simple design, white background --v 6.0",
                'MJ 产品摄影 (Product Shot)': "/imagine prompt: professional product photography of [Subject], studio lighting, neutral beige background, soft shadows, 8k resolution, advertisement quality --v 6.0"
            },
            "📝 写作与社媒 (Writing & Social)": {
                '小红书爆款 (Xiaohongshu Viral)': "Role: 小红书博主\nTask: 为[产品/主题]写一篇种草笔记。\n要求：\n1. 标题包含Emoji，吸引眼球（如：'绝绝子！'，'后悔没早买'）。\n2. 正文分段，多用表情符号，语气亲切。\n3. 结尾引导评论和收藏。\n4. 添加5个热门Hashtag。",
                '公众号爆文标题 (WeChat Title)': "Role: Experienced Copywriter\nTask: Generate 10 viral titles for an article about [Topic].\nStyle: Clickbaity, Emotional, Curiosity-driven, Numbered Lists.",
                '知乎高赞回答 (Zhihu Answer)': "Role: Knowledge Expert\nTask: Write a detailed, logic-driven answer for the question: [Question].\nStructure: Conclusion first -> Case Study -> Analysis -> Summary. Tone: Professional and objective.",
                '视频脚本 (YouTube/TikTok)': "Role: Scriptwriter\nTask: Write a video script for [Topic].\nStructure:\n1. Hook (0-5s): Visual/Audio shock.\n2. Pain Point: Why the viewer should care.\n3. Solution: The core content.\n4. CTA: Like and Subscribe.",
                'LinkedIn 领英动态 (Thought Leader)': "Role: Industry Thought Leader\nTask: Write a LinkedIn post about [Topic].\nTone: Professional, Insightful, Encouraging discussion.\nStructure: Hook -> Insight -> Question for audience.",
                '小说故事创作 (Storytelling)': "Role: Novelist\nTask: Write a short story scene about [Scenario].\nFocus: Show, don't tell. Focus on sensory details and character emotions."
            },
            "💻 编程与开发 (Coding & Dev)": {
                'Python 除错 (Python Debugger)': "Role: Python Expert\nTask: Find the bug in this code and explain the fix.\nCode:\n[Paste Code Here]",
                '代码解释 (Code Explainer)': "Role: Senior Engineer\nTask: Explain the following code snippet to a junior developer in simple terms.\nCode:\n[Paste Code Here]",
                'SQL 查询优化 (SQL Optimizer)': "Role: Database Administrator\nTask: Optimize this SQL query for performance.\nQuery:\n[Paste SQL Here]",
                '正则生成器 (Regex Generator)': "Role: Regex Expert\nTask: Create a Regular Expression to match: [Describe Requirement]\nOutput: The Regex pattern and a breakdown of how it works.",
                'Git 提交信息生成 (Git Commit)': "Role: Developer\nTask: Generate a conventional commit message for these changes: [Describe Changes]",
                '前端组件生成 (React Component)': "Role: Frontend Dev\nTask: Create a React functional component for [Component Name] using Tailwind CSS. It should handle [Functionality]."
            },
            "🎓 学术与办公 (Academic & Office)": {
                '学术论文润色 (Academic Polish)': "Role: Academic Editor\nTask: Polish the following text for a top-tier journal (Nature/Science style).\nRequirements: Enhance clarity, fix grammar, remove repetition, and ensure a formal academic tone.\nText:\n[Paste Text Here]",
                '周报生成器 (Weekly Report)': "请根据以下工作内容生成一份周报：\n[输入工作内容]\n\n要求：分为'本周进展'、'存在问题'、'下周计划'，语言简练，数据量化。",
                '邮件润色 (Email Polisher)': "Role: Communication Coach\nTask: Rewrite this email to be more professional, polite, and concise.\nDraft:\n[Paste Draft]",
                'Excel 公式生成 (Excel Formula)': "I need an Excel formula to: [Describe goal, e.g., sum column A if column B contains 'X']. Explain how it works.",
                'PPT 大纲生成 (Presentation)': "Role: Presentation Expert\nTask: Create a 10-slide outline for a presentation about [Topic].\nInclude: Slide Title, Key Bullet Points, and Visual Suggestion for each slide.",
                '中英互译 (Pro Translator)': "Role: Professional Translator\nTask: Translate the following text into [Target Language]. Maintain the original nuance and tone."
            },
            "🤣 趣味与角色 (Fun & Roleplay)": {
                'Linux 终端 (Linux Terminal)': "I want you to act as a linux terminal. I will type commands and you will reply with what the terminal should show. I want you to only reply with the terminal output inside one unique code block, and nothing else. do not write explanations. My first command is pwd",
                '文字冒险游戏 (Text Adventure)': "I want you to act as a text based adventure game. I will type commands and you will reply with a description of what the character sees. The game is set in [Setting, e.g., Zombie Apocalypse].",
                '塔罗牌占卜 (Tarot Reader)': "Role: Tarot Reader\nTask: Draw 3 cards for me regarding [Question].\nOutput: Card names, meanings, and a final interpretation of the spread.",
                '苏格拉底导游 (Socratic Guide)': "Role: Socrates\nTask: Help me solve [Problem] not by giving answers, but by asking me probing questions that lead me to the solution myself.",
                '辩论对手 (Debate Opponent)': "Role: Debater\nTask: I argue that [Opinion]. You must argue the opposite side logically and persuasively.",
                '解梦大师 (Dream Interpreter)': "Role: Jungian Analyst\nTask: Interpret my dream: [Describe Dream]. Focus on archetypes and subconscious meanings."
            }
        };

        const libraryTemplates = {};
        Object.values(libraryGroups).forEach(group => Object.assign(libraryTemplates, group));

        // === 2. 工具配置 ===
        const tools = {
            // === 写作 (Copywriting) 增强版 ===
            text: {
                title: "Copywriter (写作)",
                models: ['GPT-4o', 'Claude 3 Opus', 'Gemini Pro'],
                inputs: [
                    { id: 'topic', label: 'Topic (主题)', type: 'text', placeholder: 'e.g. 2026年人工智能发展趋势' },
                    { id: 'type', label: 'Format (文体类型)', type: 'select', options: [
                        'Blog Post (博客/公众号)', 'Social Media Post (社媒动态)', 'Press Release (新闻通稿)', 
                        'Speech/Script (演讲稿/脚本)', 'Cold Email (冷邮件)', 'Twitter/X Thread (推特串推)',
                        'Product Description (产品文案)', 'Story/Fiction (故事/小说)', 'Poem/Lyric (诗歌/歌词)'
                    ]},
                    { id: 'framework', label: 'Framework (思维模型)', type: 'select', options: [
                        'AIDA (Attention-Interest-Desire-Action)', 'PAS (Problem-Agitation-Solution)', 
                        'FAB (Features-Advantages-Benefits)', '4Ps (Product-Price-Place-Promotion)', 
                        'StoryBrand (品牌故事七步法)', 'QUEST (Qualify-Understand-Educate-Stimulate-Transition)',
                        'First Principles (第一性原理)', 'Golden Circle (Why-How-What)'
                    ]},
                    { id: 'tone', label: 'Tone of Voice (语气风格)', type: 'select', options: [
                        'Professional (专业严谨)', 'Conversational (像朋友聊天)', 'Humorous/Witty (幽默风趣)', 
                        'Urgent/Hype (紧迫感/营销)', 'Empathetic (共情/治愈)', 'Academic (学术/客观)', 
                        'Sarcastic (讽刺/毒舌)', 'Luxury (高端/奢华)'
                    ]},
                    { id: 'length', label: 'Length (篇幅长度)', type: 'select', options: [
                        'Short (<100 words / 短文案)', 'Medium (300-500 words / 中篇)', 'Long (>1000 words / 长文)', 
                        'Twitter Style (280 chars / 推文)', 'Outline Only (仅大纲)'
                    ]}
                ]
            },
            // === 小红书 (XHS) 增强版 ===
            xhs: {
                title: "Xiaohongshu Matrix (小红书矩阵)",
                models: ['Claude 3 (Best for Vibe)', 'GPT-4'],
                inputs: [
                    { id: 'topic', label: 'Topic (选题)', type: 'text', placeholder: 'e.g. 减肥食谱 / 沉浸式护肤' },
                    { id: 'niche', label: 'Niche (赛道/垂类)', type: 'select', options: [
                        'Beauty/Skincare (美妆护肤)', 'Fashion/OOTD (时尚穿搭)', 'Food/Cooking (美食烹饪)', 
                        'Home/Decor (家居装修)', 'Travel/Vlog (旅行攻略)', 'Education (知识干货)', 
                        'Career/Work (职场经验)', 'Fitness (运动健身)', 'Baby/Parenting (母婴育儿)', 'Tech/Digital (数码科技)'
                    ]},
                    { id: 'persona', label: 'Persona (博主人设)', type: 'select', options: [
                        'Girlfriend/BFF (好闺蜜/种草姬)', 'Professional Coach (专业导师/成分党)', 
                        'Big Sister (知心大姐姐/情感)', 'Student/Gen Z (学生党/省钱)', 
                        'Rich/Luxury (贵妇/名媛)', 'Minimalist (极简主义者)', 'Funny/Drama (搞笑女/戏精)'
                    ]},
                    { id: 'title_style', label: 'Title Hook (标题风格)', type: 'select', options: [
                        'Emotional Shock (情绪宣泄: 绝绝子!)', 'Negative Warning (避雷预警: 千万别买!)', 
                        'Number List (数字盘点: 3个好物...)', 'Tutorial (保姆级教程: 手把手教你)', 
                        'Curiosity (悬念勾引: 谁懂啊...)', 'Comparison (红黑榜测评)'
                    ]},
                    { id: 'emoji', label: 'Emoji Density (Emoji浓度)', type: 'select', options: [
                        'Standard (标准: 适量点缀)', 'Heavy (氛氛感: 满屏✨💖🔥)', 'Minimal (极简: 几乎没有)', 'Key Points (仅用于列表)'
                    ]},
                    { id: 'cta', label: 'Interaction (互动策略)', type: 'select', options: [
                        'Ask Question (提问引导评论)', 'Collect for Later (引导收藏防走丢)', 
                        'Tag Friends (艾特闺蜜来看)', 'Follow Series (关注看下集)', 'Get Resources (回复求资料)'
                    ]}
                ]
            },
            // === 其他原有工具保持完整 (Video, Visual, Audio, Academic, Email, Reverse, Library, TikTok) ===
            visual: {
                title: "Visual Director (视觉)",
                models: ['Midjourney V6', 'Niji V6', 'Stable Diffusion XL', 'DALL-E 3'],
                inputs: [
                    { id: 'subject', label: 'Subject (画面主体)', type: 'text', placeholder: 'e.g. 赛博朋克风格的猫', magic: true },
                    { id: 'style', label: 'Art Style (艺术风格)', type: 'select', options: ['Photorealistic', 'Cyberpunk', 'Anime/Manga', '3D Render', 'Oil Painting', 'Watercolor', 'Pixel Art', 'Ukiyo-e', 'Vaporwave', 'Steampunk', 'Bauhaus', 'Minimalist Vector', 'Claymation', 'Gothic', 'Surrealism', 'Impressionism']},
                    { id: 'shot', label: 'Camera Shot (构图/运镜)', type: 'select', options: ['Wide Angle', 'Ultra-Wide', 'Telephoto', 'Macro', 'Drone View', 'Isometric', 'Selfie', 'Fisheye', 'Over-the-Shoulder', 'Low Angle', 'Dutch Angle', 'Eye-Level']},
                    { id: 'light', label: 'Lighting (布光)', type: 'select', options: ['Cinematic Lighting', 'Natural Light', 'Golden Hour', 'Blue Hour', 'Neon Lights', 'Rembrandt Lighting', 'Butterfly Lighting', 'Split Lighting', 'Volumetric/God Rays', 'Studio Softbox', 'Bioluminescent']},
                    { id: 'film', label: 'Film Stock (胶片质感)', type: 'select', options: ['Digital Clean', 'Kodak Portra 400', 'Fujifilm Velvia', 'Ilford HP5', 'Kodak Gold 200', 'Polaroid', 'VHS Tape']}
                ]
            },
            video: {
                title: "Video Director (视频)",
                models: ['Runway Gen-2', 'Pika Labs', 'Sora', 'Stable Video'],
                inputs: [
                    { id: 'subject', label: 'Subject (视频内容)', type: 'text', placeholder: 'e.g. 海浪拍打礁石' },
                    { id: 'camera', label: 'Camera Movement (运镜方式)', type: 'select', options: ['Pan Right', 'Pan Left', 'Tilt Up', 'Tilt Down', 'Zoom In', 'Zoom Out', 'Orbit/Arc', 'FPV Drone', 'Truck Left/Right', 'Dolly In/Out', 'Handheld']},
                    { id: 'motion', label: 'Motion Intensity (动态幅度)', type: 'select', options: ['Low', 'Medium', 'High', 'Speed Ramp']},
                    { id: 'style', label: 'Visual Style (视觉风格)', type: 'select', options: ['Cinematic', '3D Animation', 'Anime', 'Vintage VHS', 'Documentary']}
                ]
            },
            audio: {
                title: "Music Producer (音乐)",
                models: ['Suno V3', 'Udio'],
                inputs: [
                    { id: 'genre', label: 'Genre (流派)', type: 'select', options: ['Pop', 'K-pop', 'Rock', 'Jazz', 'Hip Hop', 'EDM', 'House', 'Techno', 'Dubstep', 'R&B', 'Country', 'Reggae', 'Classical', 'Epic Orchestral', 'Lo-fi', 'Phonk', 'Synthwave']},
                    { id: 'mood', label: 'Mood (情绪)', type: 'select', options: ['Happy', 'Sad', 'Energetic', 'Chill', 'Dark', 'Romantic', 'Ethereal', 'Aggressive']},
                    { id: 'vocal', label: 'Vocals (人声)', type: 'select', options: ['Female', 'Male', 'Duet', 'Instrumental', 'Choir', 'Whisper', 'Autotune']}
                ]
            },
            tiktok: {
                title: "TikTok Director (抖音脚本)",
                models: ['GPT-4o', 'Claude 3 Opus'],
                inputs: [
                    { id: 'topic', label: 'Video Topic (视频主题)', type: 'text', placeholder: 'e.g. 沉浸式开箱 iPhone 15' },
                    { id: 'hook', label: 'Opening Hook (开头黄金3秒)', type: 'select', options: ['Visual Shock', 'Contrast/Reversal', 'Pain Point Question', 'Controversial Statement', 'ASMR Sound', 'Direct Benefit', 'Storytime']},
                    { id: 'niche', label: 'Niche (赛道/垂类)', type: 'select', options: ['Beauty/Skincare', 'Tech/Gadgets', 'Food/Cooking', 'Travel/Vlog', 'Education/Tips', 'Comedy/Skit', 'Fitness/Health', 'Pet/Animals']},
                    { id: 'pace', label: 'Editing Pace (剪辑节奏)', type: 'select', options: ['Fast & Punchy', 'Slow & Cinematic', 'Sync to Beat', 'Vlog Style']},
                    { id: 'bgm', label: 'BGM Mood (音乐情绪)', type: 'select', options: ['Trending/Viral', 'Upbeat/Fun', 'Suspense/Dark', 'Lo-fi/Chill', 'Epic/Dramatic', 'Phonk/Drift']},
                    { id: 'cta', label: 'CTA (互动引导)', type: 'select', options: ['Follow for More', 'Comment Below', 'Check Link in Bio', 'Save this Video']}
                ]
            },
            academic: {
                title: "Academic Scholar (学术科研)",
                models: ['Claude 3.5 Sonnet', 'GPT-4o (Academic)'],
                inputs: [
                    { id: 'content', label: 'Abstract/Paragraph (段落/摘要)', type: 'textarea', placeholder: '在此粘贴需要润色或降重的文本...', height: '150px' },
                    { id: 'field', label: 'Research Field (研究领域)', type: 'select', options: ['Computer Science', 'Artificial Intelligence', 'Medicine/Clinical', 'Biology/Life Sciences', 'Business/Management', 'Economics', 'Engineering', 'Psychology', 'Sociology', 'Education', 'Physics/Astronomy', 'Chemistry', 'Law/Legal', 'History/Arts']},
                    { id: 'target', label: 'Target Style (投稿目标)', type: 'select', options: ['IEEE Standard', 'Nature/Science', 'APA Format', 'MLA Style', 'Chicago Style', 'Harvard Style', 'General Academic', 'Thesis/Dissertation']},
                    { id: 'goal', label: 'Optimization Goal (优化目标)', type: 'select', options: ['Polish Grammar', 'Reduce Repetition', 'Enhance Logic', 'Make Concise', 'Fix Chinglish', 'Translate to English']}
                ]
            },
            email: {
                title: "Global Sales (外贸开发)",
                models: ['GPT-4o (Sales)', 'Claude 3 Haiku'],
                inputs: [
                    { id: 'product', label: 'Product (推销产品)', type: 'text', placeholder: 'e.g. Solar Panels' },
                    { id: 'role', label: 'Recipient (收件人)', type: 'select', options: ['CEO / Owner', 'Purchasing Manager', 'Product Manager', 'Marketing Director', 'CTO', 'General Inquiry']},
                    { id: 'stage', label: 'Stage (营销阶段)', type: 'select', options: ['Cold Outreach', 'Follow Up 1', 'Follow Up 2', 'Proposal', 'Re-engagement', 'Break-up Email']},
                    { id: 'framework', label: 'Framework (营销框架)', type: 'select', options: ['AIDA', 'BAB', 'PAS', 'Direct Pitch', 'Storytelling', 'Value Proposition']},
                    { id: 'cta', label: 'CTA (行动号召)', type: 'select', options: ['Book a Call', 'Reply for Info', 'Request Sample', 'Visit Website']},
                    { id: 'lang', label: 'Language (目标语言)', type: 'select', options: ['English US', 'English UK', 'Spanish', 'French', 'German', 'Japanese', 'Arabic', 'Chinese', 'Russian']}
                ]
            },
            library: {
                title: "Prompt Vault (经典词库)",
                models: ['Universal Format'],
                inputs: [
                    { id: 'template', label: 'Select Template (选择高频模版)', type: 'select', options: [] }
                ]
            },
            reverse: {
                title: "Reverse Engineering (逆向工程)",
                models: ['GPT-4 Vision', 'Claude 3 Opus'],
                inputs: [
                    { id: 'desc', label: 'Description (补充描述)', type: 'textarea', placeholder: 'e.g. 模仿这个灯光...', height: '80px' },
                    { id: 'mode', label: 'Mode (分析模式)', type: 'select', options: ['Extract Visual Prompts', 'Analyze Layout', 'Extract Color']}
                ]
            }
        };

        let currentTool = 'visual';

        window.onload = () => { loadTool('visual'); };

        function loadTool(key) {
            currentTool = key;
            const data = tools[key];
            
            document.getElementById('toolTitle').innerText = data.title;
            document.getElementById('targetModel').innerHTML = data.models.map(m => `<option>${m}</option>`).join('');

            const uploadArea = document.getElementById('uploadArea');
            const abTestGroup = document.getElementById('abTestGroup');
            const actionBtn = document.getElementById('actionBtn');

            if (key === 'reverse') {
                uploadArea.style.display = 'block';
                abTestGroup.style.display = 'none'; 
                actionBtn.innerHTML = '<i class="fas fa-search"></i> 开始分析';
                actionBtn.classList.remove('purple');
            } else if (key === 'library') {
                uploadArea.style.display = 'none';
                abTestGroup.style.display = 'none'; 
                actionBtn.innerHTML = '<i class="fas fa-copy"></i> 获取模版';
                actionBtn.classList.add('purple');
            } else {
                uploadArea.style.display = 'none';
                abTestGroup.style.display = 'flex';
                actionBtn.innerHTML = '<i class="fas fa-bolt"></i> 立即生成';
                actionBtn.classList.remove('purple');
            }

            const container = document.getElementById('dynamicForm');
            container.innerHTML = '';
            
            data.inputs.forEach(field => {
                const div = document.createElement('div');
                div.className = 'input-group';
                
                let inputHtml = '';
                if(field.type === 'select') {
                    if(key === 'library' && field.id === 'template') {
                        let optsHtml = '';
                        for(const [groupName, groupItems] of Object.entries(libraryGroups)) {
                            optsHtml += `<optgroup label="${groupName}">`;
                            for(const templateName of Object.keys(groupItems)) {
                                optsHtml += `<option value="${templateName}">${templateName}</option>`;
                            }
                            optsHtml += `</optgroup>`;
                        }
                        inputHtml = `<select id="f_${field.id}" onchange="previewTemplate(this.value)">${optsHtml}</select>`;
                    } else {
                        const opts = field.options.map(o => `<option>${o}</option>`).join('');
                        inputHtml = `<select id="f_${field.id}">${opts}</select>`;
                    }
                } else if (field.type === 'textarea') {
                    inputHtml = `<textarea id="f_${field.id}" placeholder="${field.placeholder || ''}" style="height:${field.height || '100px'}"></textarea>`;
                } else {
                    inputHtml = `<input type="text" id="f_${field.id}" placeholder="${field.placeholder || ''}">`;
                }

                let magicBtn = '';
                if(field.magic) {
                    magicBtn = `<button class="magic-btn" onclick="magicExpand('f_${field.id}')" title="AI扩写"><i class="fas fa-magic"></i></button>`;
                }

                div.innerHTML = `<label>${field.label}</label>${inputHtml}${magicBtn}`;
                container.appendChild(div);
            });

            if (key === 'library') {
                const firstKey = Object.keys(libraryGroups["🎨 视觉创作 (Visual Art)"])[0];
                previewTemplate(firstKey);
            } else {
                document.getElementById('resultContainer').innerHTML = '';
            }

            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            const items = document.querySelectorAll('.menu-item');
            items.forEach(item => {
                if(item.getAttribute('onclick').includes(key)) item.classList.add('active');
            });
            
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                const display = document.getElementById('fileNameDisplay');
                display.style.display = 'block';
                display.innerText = `✅ 文件已就绪: ${file.name} (${(file.size/1024/1024).toFixed(2)}MB)`;
            }
        }

        function previewTemplate(key) {
            if(currentTool !== 'library') return;
            const templateContent = libraryTemplates[key] || "";
        }

        function generate() {
            const model = document.getElementById('targetModel').value;
            const isAB = document.getElementById('abTest').checked;
            const toolData = tools[currentTool];
            const fileInput = document.getElementById('fileInput');
            
            const inputs = {};
            toolData.inputs.forEach(f => {
                const el = document.getElementById(`f_${f.id}`);
                inputs[f.id] = el ? el.value : '';
            });

            if (currentTool === 'reverse' && fileInput.files.length > 0) {
                simulateVisionAnalysis(fileInput.files[0].name, model, inputs);
                return;
            }

            if (currentTool === 'library') {
                const selectedKey = inputs.template;
                const templateContent = libraryTemplates[selectedKey] || "Prompt not found.";
                const container = document.getElementById('resultContainer');
                container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
                setTimeout(() => {
                    container.innerHTML = `<div class="result-box"><div class="ab-tag">Template Loaded</div>${templateContent} <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i></div>`;
                }, 400);
                return;
            }

            const container = document.getElementById('resultContainer');
            container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;"><i class="fas fa-spinner fa-spin"></i> Generating...</div>';

            setTimeout(() => {
                container.innerHTML = ''; 
                const versions = isAB ? ['Version A', 'Version B', 'Version C'] : ['Result'];
                
                versions.forEach(ver => {
                    const prompt = buildPrompt(currentTool, model, inputs, ver);
                    const box = document.createElement('div');
                    box.className = 'result-box';
                    box.innerHTML = `<div class="ab-tag">${ver}</div>${prompt} <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                    container.appendChild(box);
                });
            }, 800);
        }

        function simulateVisionAnalysis(filename, model, inputs) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            const steps = [`🔍 Reading ${filename}...`, `🧠 Extracting semantics...`, `✨ Generating prompt...`];
            let stepIndex = 0;
            const box = document.createElement('div');
            box.className = 'result-box';
            box.style.color = 'var(--text-sub)';
            container.appendChild(box);

            const interval = setInterval(() => {
                if (stepIndex >= steps.length) {
                    clearInterval(interval);
                    box.style.color = '#10b981';
                    box.innerHTML = `<div class="ab-tag">Analysis Result</div>/imagine prompt: highly detailed shot of ${filename} content...`;
                    box.innerHTML += ` <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                } else {
                    box.innerText = steps[stepIndex];
                    stepIndex++;
                }
            }, 600);
        }

        function buildPrompt(toolKey, model, inputs, ver) {
            const cleanInputs = {};
            for (const key in inputs) {
                const val = inputs[key];
                if (val && val.includes('(')) cleanInputs[key] = val.split('(')[0].trim();
                else cleanInputs[key] = val;
            }

            let res = "";
            if (toolKey === 'text') {
                res = `Role: Expert Copywriter\nTask: Write a [${cleanInputs.type}] about [${cleanInputs.topic}].\nTone: ${cleanInputs.tone}\nFramework: ${cleanInputs.framework}\nLength: ${cleanInputs.length}\n\n[Please generate content now]`;
            } else if (toolKey === 'xhs') {
                res = `Role: Xiaohongshu Creator (${cleanInputs.persona})\nTopic: ${cleanInputs.topic}\nNiche: ${cleanInputs.niche}\n\nGuidelines:\n1. Title Style: ${cleanInputs.title_style}\n2. Emoji Usage: ${cleanInputs.emoji}\n3. Interaction Goal: ${cleanInputs.cta}\n\n[Generate the Note Content]`;
            } else if (toolKey === 'email') {
                res = `Subject: [Hook for ${cleanInputs.product}]\n\nHi [Name],\n\n(Context: Sales to ${cleanInputs.role})\n[Body using ${cleanInputs.framework}...]\n\n[CTA: ${cleanInputs.cta}]`;
            } else if (toolKey === 'tiktok') {
                res = `Title: [${cleanInputs.topic}]\nTarget: TikTok\nLength: ${cleanInputs.duration}\n\n[Hook (${cleanInputs.hook})]: (0-3s script)\n[Content]: (Main script, Pace: ${cleanInputs.pace})\n[BGM]: (${cleanInputs.bgm})\n[CTA]: ${cleanInputs.cta}`;
            } else if (toolKey === 'academic') {
                res = `[Field: ${cleanInputs.field}]\n[Target: ${cleanInputs.target}]\n[Goal: ${cleanInputs.goal}]\n\nRevised Text:\n(AI Polished version of input...)`;
            } else if (toolKey === 'visual') {
                res = `/imagine prompt: ${Object.values(cleanInputs).join(', ')} --v 6.0`;
            } else if (toolKey === 'audio') {
                res = `[Genre: ${cleanInputs.genre}] [Instruments: ${cleanInputs.genre}] [Mood: ${cleanInputs.mood}] [Vocals: ${cleanInputs.vocal}]`;
            } else {
                res = `### Task: ${tools[toolKey].title}\n### Inputs: ${JSON.stringify(cleanInputs)}\n### Model: ${model}`;
            }
            return res;
        }

        function copyText(icon) {
            navigator.clipboard.writeText(icon.parentElement.innerText.replace("Copy", "").trim());
            alert("Copied!");
        }

        function magicExpand(id) {
            document.getElementById(id).value += " (AI Optimized)";
        }
    </script>
</body>
</html>
