<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CommandOS V10 | 场景化矩阵版</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --sidebar: #1e293b;
            --card: #334155;
            --accent: #38bdf8; /* Sky Blue */
            --accent-hover: #0ea5e9;
            --text: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #475569;
            --gold: #facc15;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        /* --- 侧边栏 (多级菜单) --- */
        .sidebar {
            width: 250px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 0;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .brand {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent); }

        .menu-group-title {
            padding: 15px 20px 5px;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-sub);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-sub);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid transparent;
        }

        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: rgba(56, 189, 248, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .menu-item i { width: 18px; text-align: center; }

        /* --- 主区域 --- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: var(--bg);
        }

        .tool-title { font-size: 1.2rem; font-weight: bold; }

        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- 动态表单区域 --- */
        .form-card {
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-full { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; color: var(--text-sub); font-size: 0.85rem; }
        
        input, select, textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        textarea { resize: vertical; min-height: 100px; }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }

        .result-area {
            position: relative;
            background: #000;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
        }
        .result-text {
            width: 100%;
            background: transparent;
            border: none;
            color: #4ade80;
            font-family: monospace;
            min-height: 150px;
            resize: none;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .copy-tag {
            position: absolute; top: 10px; right: 10px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text-sub); padding: 5px 10px; border-radius: 4px;
            font-size: 0.8rem; cursor: pointer;
        }
        .copy-tag:hover { color: white; border-color: white; }

        /* Pro 锁 */
        .locked-item { opacity: 0.5; position: relative; cursor: not-allowed; }
        .locked-item::after {
            content: "🔒 Pro"; position: absolute; right: 10px; top: 12px;
            font-size: 0.8rem; color: var(--gold);
        }

        /* 弹窗 */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 999;
        }
        .modal-content {
            background: var(--sidebar); padding: 40px; border-radius: 16px;
            text-align: center; max-width: 400px; border: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; border-bottom: 1px solid var(--border); border-right: none;}
            .menu-group-title { display: none; }
            .menu-item { white-space: nowrap; padding: 8px 12px; }
            .form-grid { grid-template-columns: 1fr; }
            .topbar { display: none; }
        }
    </style>
</head>
<body>

    <div class="modal" id="proModal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <i class="fas fa-crown" style="font-size: 3rem; color: var(--gold); margin-bottom: 20px;"></i>
            <h2>升级 Pro 商业版</h2>
            <p style="color: var(--text-sub); margin-bottom: 20px;">解锁“学术润色”、“冷邮件营销”等高价值生产力工具。</p>
            <button class="btn" style="background: var(--gold); color: black;" onclick="window.open('https://your-link.com')">¥99 立即解锁</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="brand"><i class="fas fa-th-large"></i> Matrix<span>OS</span></div>

        <div class="menu-group-title">🎨 视觉设计 (Visual)</div>
        <div class="menu-item active" onclick="loadTool('logo')"><i class="fas fa-vector-square"></i> Logo / 图标设计</div>
        <div class="menu-item" onclick="loadTool('product')"><i class="fas fa-camera"></i> 电商产品摄影</div>
        <div class="menu-item" onclick="loadTool('ui')"><i class="fas fa-mobile-alt"></i> UI / 网页界面</div>
        <div class="menu-item" onclick="loadTool('anime')"><i class="fas fa-magic"></i> 二次元/IP角色</div>

        <div class="menu-group-title">✍️ 商业写作 (Copy)</div>
        <div class="menu-item" onclick="loadTool('xhs')"><i class="fab fa-instagram"></i> 小红书爆文</div>
        <div class="menu-item" onclick="loadTool('tiktok')"><i class="fab fa-tiktok"></i> 抖音/Tiktok脚本</div>
        <div class="menu-item locked-item" onclick="showPro()"><i class="fas fa-envelope-open-text"></i> 外贸冷邮件 (Sales)</div>
        <div class="menu-item locked-item" onclick="showPro()"><i class="fas fa-graduation-cap"></i> 学术润色 (Academic)</div>

        <div class="menu-group-title">🎵 音频工坊 (Audio)</div>
        <div class="menu-item" onclick="loadTool('lyrics')"><i class="fas fa-pen-nib"></i> 歌词创作</div>
        <div class="menu-item" onclick="loadTool('suno')"><i class="fas fa-music"></i> Suno 风格指令</div>
    </div>

    <div class="main">
        <div class="topbar">
            <div class="tool-title" id="currentToolTitle">Logo / 图标设计</div>
            <div style="font-size: 0.9rem; color: var(--text-sub); cursor: pointer;" onclick="showPro()">👑 升级会员</div>
        </div>

        <div class="content-area">
            <div class="form-card" id="dynamicForm">
                </div>

            <div class="result-area">
                <div class="copy-tag" onclick="copyResult()">复制指令</div>
                <textarea class="result-text" id="resultBox" readonly placeholder="点击生成按钮，这里会出现专业的 Prompt..."></textarea>
            </div>
        </div>
    </div>

    <script>
        // 工具配置数据 (真正的细分核心)
        const tools = {
            // --- 视觉类 ---
            logo: {
                title: "Logo / 图标设计生成",
                inputs: [
                    { id: 'brand', label: '品牌名称 (Brand Name)', type: 'text', placeholder: 'e.g. NexusAI' },
                    { id: 'industry', label: '行业属性', type: 'select', options: ['Tech Technology', 'Coffee Shop', 'Beauty Brand', 'Gaming', 'Real Estate'] },
                    { id: 'style', label: '设计风格', type: 'select', options: ['Minimalist vector line art (极简线条)', 'Gradient tech glassmorphism (科技毛玻璃)', 'Cute mascot character (可爱吉祥物)', 'Vintage badge style (复古徽章)', 'Abstract geometric (抽象几何)'] },
                    { id: 'color', label: '主色调', type: 'text', placeholder: 'e.g. Neon Blue and White' }
                ],
                template: (d) => `/imagine prompt: a professional logo design for "${d.brand}", industry: ${d.industry}, style: ${d.style}, primary color: ${d.color}, white background, vector graphics, scalable, dribbble trend --v 6.0 --no text realistic photo`
            },
            product: {
                title: "电商产品摄影 (Commercial)",
                inputs: [
                    { id: 'product', label: '产品主体', type: 'text', placeholder: 'e.g. A bottle of luxury perfume' },
                    { id: 'bg', label: '背景环境', type: 'select', options: ['Studio solid color (纯色影棚)', 'Marble podium with water ripples (大理石水波纹)', 'Natural sunlight with plant shadows (自然光植物投影)', 'Cyberpunk neon street (赛博街头)'] },
                    { id: 'angle', label: '拍摄角度', type: 'select', options: ['Front view', 'Top down view (Knolling)', 'Low angle hero shot', 'Macro close-up details'] },
                    { id: 'lighting', label: '布光方式', type: 'select', options: ['Softbox lighting (柔光)', 'Hard dramatic lighting (硬光)', 'Backlighting (背光)', 'Natural window light'] }
                ],
                template: (d) => `/imagine prompt: professional product photography of ${d.product}, background: ${d.bg}, shot angle: ${d.angle}, lighting: ${d.lighting}, 8k resolution, highly detailed, commercial advertisement quality --ar 4:5 --v 6.0`
            },
            ui: {
                title: "UI / 网页界面设计",
                inputs: [
                    { id: 'page', label: '页面类型', type: 'text', placeholder: 'e.g. Mobile App Login Screen' },
                    { id: 'theme', label: '配色主题', type: 'select', options: ['Dark Mode (暗黑模式)', 'Clean White (极简白)', 'Pastel Colors (马卡龙色)', 'Cyberpunk Neon'] },
                    { id: 'element', label: '包含元素', type: 'text', placeholder: 'e.g. 3D charts, glass cards' }
                ],
                template: (d) => `/imagine prompt: UI design for ${d.page}, theme: ${d.theme}, featuring ${d.element}, clean layout, behance trending, dribbble, high fidelity mockup, vector --ar 9:16 --v 6.0`
            },
            anime: {
                title: "二次元 / IP 角色设计",
                inputs: [
                    { id: 'char', label: '角色特征', type: 'text', placeholder: 'e.g. Silver hair girl with cat ears' },
                    { id: 'outfit', label: '服装', type: 'text', placeholder: 'e.g. Cyberpunk jacket' },
                    { id: 'style', label: '画风', type: 'select', options: ['Anime impasto (厚涂)', 'Cel shading (赛璐璐)', 'Kyoto Animation style', 'Genshin Impact style'] },
                    { id: 'view', label: '视图', type: 'select', options: ['Character sheet (三视图)', 'Full body portrait', 'Dynamic pose'] }
                ],
                template: (d) => `/imagine prompt: anime character design, ${d.char}, wearing ${d.outfit}, art style: ${d.style}, view: ${d.view}, white background, high quality illustration, masterpiece --niji 6`
            },

            // --- 写作类 ---
            xhs: {
                title: "小红书爆文生成器",
                inputs: [
                    { id: 'topic', label: '笔记主题', type: 'text', placeholder: 'e.g. 减肥食谱' },
                    { id: 'vibe', label: '语气风格', type: 'select', options: ['闺蜜吐槽风 (真诚)', '干货专家风 (专业)', '沉浸式治愈风 (温柔)', '标题党 (夸张)'] },
                    { id: 'hook', label: '开头钩子', type: 'text', placeholder: 'e.g. 后悔没有早点知道...' }
                ],
                template: (d) => `Role: 小红书博主\nTask: 写一篇关于"${d.topic}"的笔记。\nTone: ${d.vibe}\n\nRequirements:\n1. Title: 包含Emoji，极具吸引力，例如"${d.hook}"\n2. Body: 分点陈述，多用Emoji，视觉舒适。\n3. Tags: 包含5个热门标签。\n4. CTA: 引导收藏和评论。`
            },
            tiktok: {
                title: "抖音 / TikTok 短视频脚本",
                inputs: [
                    { id: 'topic', label: '视频主题', type: 'text', placeholder: 'e.g. iPhone 15 评测' },
                    { id: 'duration', label: '时长', type: 'select', options: ['15秒 (快速种草)', '30秒 (剧情反转)', '60秒 (深度解说)'] },
                    { id: 'type', label: '类型', type: 'select', options: ['口播 (Talking Head)', 'Vlog (生活记录)', 'ASMR (沉浸式)'] }
                ],
                template: (d) => `Role: 抖音脚本编剧\nTask: 为"${d.topic}"写一个${d.duration}的脚本。\nType: ${d.type}\n\nStructure:\n1. [0-3s] 黄金3秒: 给出极强的视觉或听觉钩子。\n2. [Middle] 内容核心: 痛点+爽点。\n3. [End] 引导关注。\n请按表格形式输出：画面 | 台词 | 音效`
            },

            // --- 音频类 ---
            lyrics: {
                title: "专业歌词创作",
                inputs: [
                    { id: 'theme', label: '歌曲主题', type: 'text', placeholder: 'e.g. 失恋的痛苦' },
                    { id: 'style', label: '曲风', type: 'select', options: ['Mandopop (华语流行)', 'Rap (说唱)', 'Folk (民谣)', 'Rock (摇滚)'] },
                    { id: 'rhyme', label: '押韵要求', type: 'select', options: ['AABB', 'ABAB', 'Freestyle'] }
                ],
                template: (d) => `Role: 专业作词人\nTask: 写一首关于"${d.theme}"的歌词。\nStyle: ${d.style}\nRhyme Scheme: ${d.rhyme}\n\nStructure:\n[Verse 1]\n[Chorus]\n[Verse 2]\n[Chorus]\n[Bridge]\n[Outro]`
            },
            suno: {
                title: "Suno 元标签 / 风格指令",
                inputs: [
                    { id: 'genre', label: '流派 (Genre)', type: 'select', options: ['K-pop', 'Epic Orchestral', 'Lo-fi Hip Hop', 'Cyberpunk Phonk'] },
                    { id: 'vocal', label: '人声 (Vocal)', type: 'select', options: ['Female Whisper', 'Male Belting', 'Choir', 'Instrumental'] },
                    { id: 'mood', label: '情绪 (Mood)', type: 'text', placeholder: 'e.g. Dark, Aggressive' }
                ],
                template: (d) => `[Style: ${d.genre}]\n[Vocals: ${d.vocal}]\n[Mood: ${d.mood}]\n[Tempo: Variable]\n\n(Prompt for Suno description)`
            }
        };

        // 当前激活的工具ID
        let currentToolId = 'logo';

        // 初始化
        window.onload = () => {
            loadTool('logo');
        };

        // 加载工具函数
        function loadTool(toolId) {
            currentToolId = toolId;
            const tool = tools[toolId];
            
            // 更新标题
            document.getElementById('currentToolTitle').innerText = tool.title;
            
            // 更新侧边栏高亮
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // 动态生成表单
            const formContainer = document.getElementById('dynamicForm');
            formContainer.innerHTML = ''; // 清空旧表单

            let html = '<div class="form-grid">';
            
            tool.inputs.forEach((input, index) => {
                // 如果是奇数个输入框，最后一个占满一行
                if (index === tool.inputs.length - 1 && tool.inputs.length % 2 !== 0) {
                    html += `</div><div class="form-full">`;
                }

                html += `<div><label>${input.label}</label>`;
                
                if (input.type === 'select') {
                    html += `<select id="input_${input.id}">`;
                    input.options.forEach(opt => {
                        html += `<option value="${opt}">${opt}</option>`;
                    });
                    html += `</select>`;
                } else {
                    html += `<input type="text" id="input_${input.id}" placeholder="${input.placeholder}">`;
                }
                html += `</div>`;
            });

            if (tool.inputs.length % 2 === 0) html += '</div>'; // 关闭grid
            if (tool.inputs.length % 2 !== 0) html += '</div>'; // 关闭full

            // 添加生成按钮
            html += `<button class="btn" onclick="generatePrompt()">⚡️ 生成指令</button>`;
            
            formContainer.innerHTML = html;
            
            // 清空结果
            document.getElementById('resultBox').value = '';
        }

        // 生成指令函数
        function generatePrompt() {
            const tool = tools[currentToolId];
            const data = {};
            
            // 收集数据
            tool.inputs.forEach(input => {
                data[input.id] = document.getElementById(`input_${input.id}`).value;
            });

            // 调用模版生成
            const result = tool.template(data);
            
            // 显示结果
            document.getElementById('resultBox').value = result;
        }

        // 复制功能
        function copyResult() {
            const el = document.getElementById('resultBox');
            if (!el.value) return;
            el.select();
            document.execCommand('copy');
            alert('已复制！');
        }

        // 弹窗
        function showPro() {
            document.getElementById('proModal').style.display = 'flex';
        }
    </script>
</body>
</html>
