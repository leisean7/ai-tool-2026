<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CommandOS V15 | 全栈全参数版</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --sidebar: #151921;
            --panel: #222630;
            --input: #2f3442;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #e2e8f0;
            --text-sub: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
            --green: #10b981;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        /* --- 布局 --- */
        .app-container { display: flex; width: 100%; height: 100%; }
        
        /* 侧边栏 */
        .sidebar {
            width: 250px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
            overflow-y: auto;
        }

        .brand {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent); }

        .menu-category { padding: 20px 20px 8px; font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        
        .menu-item {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-sub);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: rgba(59, 130, 246, 0.15); color: var(--accent); border-left-color: var(--accent); }
        .menu-item i { width: 16px; text-align: center; }

        /* 工作区 */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
            position: relative;
        }

        .topbar {
            height: 55px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg);
        }

        .model-selector select {
            background: var(--panel); color: white; border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
        }

        .scroll-area {
            flex: 1; overflow-y: auto; padding: 20px; max-width: 1000px; margin: 0 auto; width: 100%;
        }

        /* 上下文面板 */
        .context-panel {
            width: 280px;
            background: var(--sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 20px;
            overflow-y: auto;
        }

        /* --- 组件 --- */
        .card-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 15px; color: var(--text-sub); display: flex; justify-content: space-between; text-transform: uppercase; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group { position: relative; }
        
        label { display: block; margin-bottom: 6px; color: var(--text-sub); font-size: 0.8rem; }
        input, select, textarea {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; font-family: inherit; margin-bottom: 0;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #3b4050; }

        .magic-btn {
            position: absolute; right: 8px; top: 28px;
            background: transparent; border: none; color: var(--gold);
            cursor: pointer; font-size: 0.9rem; padding: 4px;
        }
        .magic-btn:hover { transform: scale(1.1); }

        .action-bar { display: flex; gap: 15px; align-items: center; margin-top: 10px; padding-bottom: 30px; }
        .btn-main {
            flex: 1; padding: 12px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }
        .btn-main:hover { background: var(--accent-hover); transform: translateY(-1px); }
        
        .switch-group { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 0.85rem; cursor: pointer; user-select: none; }
        .switch-group input { margin: 0; accent-color: var(--accent); }

        /* 结果展示 */
        .result-container { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .result-box {
            background: #000; border: 1px solid var(--border); border-radius: 8px;
            padding: 15px; font-family: 'Monaco', monospace; color: #10b981;
            font-size: 0.85rem; line-height: 1.5; min-height: 80px; white-space: pre-wrap; position: relative;
        }
        .ab-tag {
            position: absolute; top: 0; left: 0; background: var(--panel); 
            padding: 2px 8px; font-size: 0.7rem; border-bottom-right-radius: 6px; color: var(--text-sub); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
        }

        /* 移动端适配 */
        .mobile-toggle { display: none; font-size: 1.2rem; color: white; cursor: pointer; }
        @media (max-width: 1024px) { .context-panel { display: none; } }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; height: 100%; transition: 0.3s; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .mobile-toggle { display: block; }
            .topbar { padding: 0 15px; }
            .scroll-area { padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="sidebar" id="sidebar">
            <div class="brand"><i class="fas fa-terminal"></i> Command<span>OS</span></div>
            
            <div class="menu-category">Generative Studio</div>
            <div class="menu-item active" onclick="loadTool('visual')"><i class="fas fa-camera"></i> 视觉 (Visual)</div>
            <div class="menu-item" onclick="loadTool('video')"><i class="fas fa-video"></i> 视频 (Video)</div>
            <div class="menu-item" onclick="loadTool('audio')"><i class="fas fa-music"></i> 音乐 (Audio)</div>
            <div class="menu-item" onclick="loadTool('text')"><i class="fas fa-pen-nib"></i> 写作 (Copy)</div>
            
            <div class="menu-category">Vertical Matrix</div>
            <div class="menu-item" onclick="loadTool('xhs')"><i class="fab fa-instagram"></i> 小红书矩阵</div>
            <div class="menu-item" onclick="loadTool('tiktok')"><i class="fab fa-tiktok"></i> 抖音/TikTok</div>
            <div class="menu-item" onclick="loadTool('email')"><i class="fas fa-envelope"></i> 外贸开发信</div>
            <div class="menu-item" onclick="loadTool('academic')"><i class="fas fa-graduation-cap"></i> 学术/论文</div>
            
            <div class="menu-category">Tools</div>
            <div class="menu-item" onclick="loadTool('reverse')"><i class="fas fa-code-branch"></i> 提示词反推</div>
        </div>

        <div class="workspace">
            <div class="topbar">
                <div style="display:flex; gap:15px; align-items:center;">
                    <i class="fas fa-bars mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"></i>
                    <span style="font-weight:bold; font-size:1.1rem;" id="toolTitle">视觉指令台</span>
                </div>
                <div class="model-selector">
                    <select id="targetModel">
                        </select>
                </div>
            </div>

            <div class="scroll-area">
                <div id="dynamicForm" class="form-grid"></div>

                <div class="action-bar">
                    <div class="switch-group">
                        <input type="checkbox" id="abTest"> <span>A/B 测试 (3版)</span>
                    </div>
                    <button class="btn-main" onclick="generate()">
                        <i class="fas fa-bolt"></i> 生成指令
                    </button>
                </div>

                <div class="card-title">
                    <span>Output Terminal</span>
                    <span style="font-size:0.75rem; cursor:pointer; color:var(--accent);" onclick="document.getElementById('resultContainer').innerHTML=''">Clear</span>
                </div>
                <div id="resultContainer" class="result-container"></div>
            </div>
        </div>

        <div class="context-panel">
            <div class="card-title">🧬 品牌 DNA (Memory)</div>
            <p style="font-size:0.8rem; color:var(--text-sub); margin-bottom:15px;">全自动注入品牌信息。</p>
            
            <label>品牌/视觉主色</label>
            <input type="text" id="dnaColor" placeholder="e.g. #FF5733, Neon Blue">

            <label>目标受众</label>
            <input type="text" id="dnaTarget" placeholder="e.g. 25岁 极客男性">

            <label>语气基调</label>
            <select id="dnaTone">
                <option value="">-- Default --</option>
                <option value="Professional">专业严谨</option>
                <option value="Witty">幽默风趣</option>
                <option value="Empathetic">治愈共情</option>
                <option value="Luxury">高端奢华</option>
            </select>

            <label>负向/禁用词</label>
            <textarea id="dnaNegative" placeholder="e.g. text, watermark, low quality..." style="height:60px;"></textarea>
        </div>

    </div>

    <script>
        // === 核心数据配置 (超全参数) ===
        const tools = {
            visual: {
                title: "Visual Director (视觉)",
                models: ['Midjourney V6', 'Niji V6', 'Stable Diffusion XL', 'DALL-E 3'],
                inputs: [
                    { id: 'subject', label: '画面主体 (Subject)', type: 'text', placeholder: 'e.g. 一只赛博朋克风格的猫', magic: true },
                    { id: 'style', label: '艺术风格 (Style)', type: 'select', options: [
                        'Photorealistic (真实摄影)', 'Cyberpunk (赛博朋克)', 'Anime (日系二次元)', 'Ghibli Studio (吉卜力)', 
                        '3D Render (C4D/Blender)', 'Unreal Engine 5 (UE5)', 'Oil Painting (油画)', 'Watercolor (水彩)',
                        'Pixel Art (像素风)', 'Ukiyo-e (浮世绘)', 'Vaporwave (蒸汽波)', 'Steampunk (蒸汽朋克)',
                        'Bauhaus (包豪斯)', 'Minimalist Vector (极简矢量)', 'Claymation (粘土动画)', 'Gothic (哥特)'
                    ]},
                    { id: 'shot', label: '构图/运镜 (Shot)', type: 'select', options: [
                        'Wide Angle (广角)', 'Ultra-Wide (超广角)', 'Telephoto (长焦)', 'Macro (微距)',
                        'Drone View (上帝视角)', 'Isometric (等轴测)', 'Low Angle (低角度)', 'Dutch Angle (荷兰式倾斜)',
                        'Over-the-Shoulder (过肩镜头)', 'Selfie (自拍)', 'Fisheye (鱼眼)'
                    ]},
                    { id: 'light', label: '布光 (Lighting)', type: 'select', options: [
                        'Cinematic Lighting (电影光)', 'Natural Light (自然光)', 'Golden Hour (黄金时刻)', 'Blue Hour (蓝调时刻)',
                        'Neon Lights (霓虹光)', 'Rembrandt (伦勃朗光)', 'Volumetric/God Rays (丁达尔光)', 'Studio Softbox (影棚柔光)',
                        'Bioluminescent (生物荧光)', 'Rim Light (轮廓光)'
                    ]},
                    { id: 'render', label: '渲染质感 (Render)', type: 'select', options: [
                        '8k Resolution', '4k', 'High Fidelity', 'Octane Render', 'Ray Tracing', 'HDR', 'Matte Finish'
                    ]}
                ]
            },
            video: {
                title: "Video Director (视频)",
                models: ['Runway Gen-2', 'Pika Labs', 'Sora (OpenAI)', 'Stable Video'],
                inputs: [
                    { id: 'subject', label: '视频内容 (Subject)', type: 'text', placeholder: 'e.g. 海浪拍打礁石', magic: true },
                    { id: 'motion', label: '动态幅度 (Motion)', type: 'select', options: ['Low (微动)', 'Medium (正常)', 'High (剧烈)', 'Speed Ramp (变速)'] },
                    { id: 'camera', label: '运镜方式 (Camera)', type: 'select', options: [
                        'Pan Right (右摇)', 'Pan Left (左摇)', 'Tilt Up (上摇)', 'Tilt Down (下摇)', 
                        'Zoom In (推镜头)', 'Zoom Out (拉镜头)', 'Truck Left (左移)', 'Truck Right (右移)',
                        'Orbit/Arc (环绕)', 'Handheld (手持感)', 'FPV Drone (穿越机)'
                    ]},
                    { id: 'fps', label: '帧率 (FPS)', type: 'select', options: ['24fps (电影感)', '30fps (标准)', '60fps (流畅)', '12fps (定格动画)'] },
                    { id: 'style', label: '风格 (Style)', type: 'select', options: ['Cinematic', 'Anime', '3D Animation', 'VHS Glitch', 'Black & White']}
                ]
            },
            audio: {
                title: "Music Producer (音乐)",
                models: ['Suno V3', 'Udio', 'Stable Audio'],
                inputs: [
                    { id: 'genre', label: '流派 (Genre)', type: 'select', options: [
                        'Pop', 'K-pop', 'J-pop', 'Mandopop', 'Rock', 'Heavy Metal', 'Jazz', 'Blues',
                        'Hip Hop', 'Trap', 'Lo-fi Hip Hop', 'Phonk', 'Drill',
                        'EDM', 'House', 'Techno', 'Dubstep', 'Synthwave',
                        'Classical', 'Epic Orchestral', 'Ambient', 'New Age'
                    ]},
                    { id: 'mood', label: '情绪 (Mood)', type: 'select', options: ['Happy', 'Sad', 'Energetic', 'Chill', 'Dark', 'Romantic', 'Aggressive', 'Ethereal'] },
                    { id: 'instrument', label: '主乐器 (Instrument)', type: 'select', options: ['Piano', 'Guitar', 'Synthesizer', 'Violin', 'Drums', 'Bass', 'Saxophone', 'Full Orchestra'] },
                    { id: 'vocal', label: '人声 (Vocals)', type: 'select', options: ['Female', 'Male', 'Duet', 'Choir', 'Instrumental (无人声)', 'Whisper', 'Autotune'] },
                    { id: 'struct', label: '结构 (Structure)', type: 'select', options: ['Verse-Chorus', 'Intro-Hook-Verse', 'Loop (30s)', 'Soundtrack']}
                ]
            },
            text: {
                title: "Copywriter (写作)",
                models: ['GPT-4o', 'Claude 3.5', 'Gemini Pro'],
                inputs: [
                    { id: 'topic', label: '主题', type: 'text', placeholder: 'e.g. 2026年AI趋势', magic: true },
                    { id: 'framework', label: '思维框架', type: 'select', options: [
                        'AIDA (注意-兴趣-欲望-行动)', 'PAS (痛点-加剧-解法)', 'SCQA (情境-冲突-问题-答案)', 
                        'First Principles (第一性原理)', 'Golden Circle (Why-How-What)', '6 Thinking Hats (六顶思考帽)'
                    ]},
                    { id: 'tone', label: '语气', type: 'select', options: ['Professional', 'Humorous', 'Storytelling', 'Direct', 'Academic', 'Persuasive'] },
                    { id: 'format', label: '格式', type: 'select', options: ['Blog Post', 'Twitter Thread', 'Email', 'Essay', 'Bullet Points']}
                ]
            },
            xhs: {
                title: "小红书矩阵",
                models: ['Claude 3 (推荐)', 'GPT-4'],
                inputs: [
                    { id: 'topic', label: '选题', type: 'text', placeholder: 'e.g. 减肥食谱' },
                    { id: 'niche', label: '赛道', type: 'select', options: ['美妆护肤', '数码科技', '穿搭', '美食', '家居', '情感', '知识付费'] },
                    { id: 'vibe', label: '人设', type: 'select', options: ['好闺蜜', '专业导师', '毒舌点评', '温柔学姐'] }
                ]
            },
            tiktok: {
                title: "抖音/TikTok脚本",
                models: ['GPT-4'],
                inputs: [
                    { id: 'topic', label: '视频主题', type: 'text' },
                    { id: 'hook', label: '黄金3秒', type: 'select', options: ['视觉奇观', '认知反差', '提问互动', '痛点直击'] },
                    { id: 'type', label: '类型', type: 'select', options: ['口播', '剧情', 'Vlog', '开箱', 'ASMR'] }
                ]
            },
            email: { title: "外贸开发信", models: ['GPT-4'], inputs: [{id:'product',label:'产品',type:'text'}, {id:'target',label:'客户类型',type:'text'}]},
            academic: { title: "学术润色", models: ['GPT-4 (Academic)'], inputs: [{id:'content',label:'原文',type:'textarea'}, {id:'goal',label:'目标',type:'select',options:['降重', '润色', '翻译']}]},
            reverse: { title: "提示词反推", models: ['GPT-4 Vision'], inputs: [{id:'desc',label:'描述图片/文案',type:'textarea', placeholder:'粘贴你要模仿的内容...'}]}
        };

        let currentTool = 'visual';

        // === 初始化 ===
        window.onload = () => loadTool('visual');

        function loadTool(key) {
            currentTool = key;
            const data = tools[key];
            
            document.getElementById('toolTitle').innerText = data.title;
            
            // 更新模型下拉框
            const modelSelect = document.getElementById('targetModel');
            modelSelect.innerHTML = data.models.map(m => `<option>${m}</option>`).join('');

            // 渲染表单
            const container = document.getElementById('dynamicForm');
            container.innerHTML = '';
            
            data.inputs.forEach(field => {
                const div = document.createElement('div');
                div.className = 'input-group';
                
                let inputHtml = '';
                if(field.type === 'select') {
                    const opts = field.options.map(o => `<option>${o}</option>`).join('');
                    inputHtml = `<select id="f_${field.id}">${opts}</select>`;
                } else if (field.type === 'textarea') {
                    inputHtml = `<textarea id="f_${field.id}" placeholder="${field.placeholder || ''}" style="height:100px;"></textarea>`;
                } else {
                    inputHtml = `<input type="text" id="f_${field.id}" placeholder="${field.placeholder || ''}">`;
                }

                let magicBtn = '';
                if(field.magic) {
                    magicBtn = `<button class="magic-btn" onclick="magicExpand('f_${field.id}')" title="AI扩写"><i class="fas fa-magic"></i></button>`;
                }

                div.innerHTML = `<label>${field.label}</label>${inputHtml}${magicBtn}`;
                container.appendChild(div);
            });

            // 菜单高亮
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            const items = document.querySelectorAll('.menu-item');
            items.forEach(item => {
                if(item.getAttribute('onclick').includes(key)) item.classList.add('active');
            });
            
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        // 魔法扩写
        function magicExpand(inputId) {
            const input = document.getElementById(inputId);
            const val = input.value;
            const context = tools[currentTool].title;
            if(!val) { 
                if(context.includes("Visual")) input.value = "Cyberpunk street, neon rain, reflection";
                else input.value = "Generate a viral post about AI trends";
                return; 
            }
            // 简单模拟
            input.value = `${val} [AI Optimized: detailed, trending, professional quality]`;
        }

        // 核心生成
        function generate() {
            const model = document.getElementById('targetModel').value;
            const isAB = document.getElementById('abTest').checked;
            const toolData = tools[currentTool];
            
            const dna = {
                color: document.getElementById('dnaColor').value,
                target: document.getElementById('dnaTarget').value,
                tone: document.getElementById('dnaTone').value,
                negative: document.getElementById('dnaNegative').value
            };

            const inputs = {};
            toolData.inputs.forEach(f => {
                inputs[f.id] = document.getElementById(`f_${f.id}`).value;
            });

            const container = document.getElementById('resultContainer');
            container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;"><i class="fas fa-spinner fa-spin"></i> Generating...</div>';

            setTimeout(() => {
                container.innerHTML = ''; 
                const versions = isAB ? ['Standard', 'Creative', 'Minimalist'] : ['Result'];
                
                versions.forEach(ver => {
                    const prompt = buildPrompt(currentTool, model, inputs, dna, ver);
                    const box = document.createElement('div');
                    box.className = 'result-box';
                    box.innerHTML = `<div class="ab-tag">${ver}</div>${prompt} <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                    container.appendChild(box);
                });
            }, 600);
        }

        function buildPrompt(toolKey, model, inputs, dna, ver) {
            let res = "";
            let context = "";
            if(dna.color) context += `Brand Color: ${dna.color} | `;
            if(dna.target) context += `Audience: ${dna.target} | `;
            if(dna.tone) context += `Tone: ${dna.tone} | `;

            if (toolKey === 'visual') {
                const base = Object.values(inputs).join(', ');
                if(model.includes('Midjourney')) {
                    res = `/imagine prompt: ${base}, ${context} --v 6.0 --ar 16:9`;
                    if(dna.negative) res += ` --no ${dna.negative}`;
                } else {
                    res = `(Masterpiece), ${base}, ${context}`;
                }
            } else if (toolKey === 'video') {
                res = `/animate prompt: ${inputs.subject}, Camera: ${inputs.camera}, Motion: ${inputs.motion}, FPS: ${inputs.fps}, Style: ${inputs.style}`;
            } else if (toolKey === 'audio') {
                res = `[Genre: ${inputs.genre}] [Instruments: ${inputs.instrument}] [Mood: ${inputs.mood}] [Vocals: ${inputs.vocal}]`;
            } else {
                res = `### Role: Expert\n### Task: ${tools[toolKey].title}\n### Context: ${context}\n### Inputs: ${JSON.stringify(inputs)}\n### Variant: ${ver}\n\n[Generate content for ${model}]`;
            }
            return res;
        }

        function copyText(icon) {
            navigator.clipboard.writeText(icon.parentElement.innerText.replace(icon.previousElementSibling.innerText, "").trim());
            alert("Copied!");
        }
    </script>
</body>
</html>
