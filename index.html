<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>AI CommandOS | 极速 AI 指令生成器 (VIP版)</title>
    <meta name="description" content="你的全能 AI 指令控制台。一键生成 Midjourney、ChatGPT、小红书、代码除错等专业提示词。">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a;
            --sidebar: #1e293b;
            --panel: #334155;
            --input: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #475569;
            --gold: #f59e0b;
            --purple: #8b5cf6;
            --success: #10b981;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        /* --- 滚动条美化 --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* --- 布局容器 --- */
        .app-container { display: flex; width: 100%; height: 100%; position: relative; }
        
        /* --- 侧边栏 --- */
        .sidebar {
            width: 260px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 30;
            transition: transform 0.3s ease;
        }

        .brand {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }
        .brand span { color: var(--accent); }

        .menu-scroll { flex: 1; overflow-y: auto; padding-bottom: 20px; }

        .menu-category { padding: 25px 20px 10px; font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        
        .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            border-left: 3px solid transparent;
            margin-bottom: 2px;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: rgba(59, 130, 246, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .menu-item i { width: 20px; text-align: center; }

        /* --- VIP 卡片 (核心引流) --- */
        .vip-card {
            margin: 15px;
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
        }
        .vip-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(245, 158, 11, 0.1), transparent);
            transform: rotate(45deg); animation: shine 3s infinite;
        }
        @keyframes shine { 0% {left: -100%;} 100% {left: 100%;} }
        
        .vip-title { color: var(--gold); font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .vip-desc { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 12px; line-height: 1.4; }
        .btn-vip {
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: white; border: none; padding: 8px 0; width: 100%;
            border-radius: 6px; font-weight: bold; cursor: pointer;
            font-size: 0.85rem; transition: transform 0.2s;
        }
        .btn-vip:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }

        /* --- 主工作区 --- */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
            position: relative;
        }

        .topbar {
            height: 64px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            z-index: 20;
        }

        .model-badge {
            background: var(--panel); border: 1px solid var(--border); color: var(--text);
            padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
        }
        .model-badge:hover { border-color: var(--accent); }
        select#targetModel { background: transparent; border: none; color: white; outline: none; cursor: pointer; font-family: inherit;}
        select#targetModel option { background: var(--panel); color: white; }

        .scroll-area {
            flex: 1; overflow-y: auto; padding: 30px; max-width: 1000px; margin: 0 auto; width: 100%;
        }

        /* --- 表单样式 --- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        
        label { color: var(--text-sub); font-size: 0.85rem; font-weight: 600; display: flex; justify-content: space-between;}
        
        input, select, textarea {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            color: white; padding: 12px 15px; border-radius: 8px; font-size: 0.95rem;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        input::placeholder, textarea::placeholder { color: #475569; }

        /* --- 按钮区 --- */
        .action-bar { display: flex; gap: 15px; align-items: center; margin-top: 10px; padding-bottom: 30px; }
        
        .btn-main {
            flex: 1; padding: 14px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: var(--shadow); font-size: 1rem; transition: all 0.2s;
        }
        .btn-main:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-main:active { transform: scale(0.98); }
        .btn-main.purple { background: var(--purple); }
        .btn-main.purple:hover { background: #7c3aed; }
        
        /* --- 结果区 --- */
        .result-container { display: flex; flex-direction: column; gap: 15px; }
        
        .result-box {
            background: #000; border: 1px solid var(--border); border-radius: 10px;
            padding: 40px 20px 20px 20px; /* Top padding for tag */
            font-family: 'Monaco', 'Consolas', monospace; color: var(--success);
            font-size: 0.9rem; line-height: 1.6; min-height: 80px; 
            white-space: pre-wrap; position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .ab-tag {
            position: absolute; top: 0; left: 0; background: var(--panel); 
            padding: 4px 12px; font-size: 0.7rem; border-bottom-right-radius: 8px; 
            color: var(--text-sub); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
            font-family: sans-serif; font-weight: bold;
        }

        .btn-copy {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255,255,255,0.1); border: none; color: var(--text-sub);
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
            transition: 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .btn-copy:hover { background: rgba(255,255,255,0.2); color: white; }

        /* --- Toast 通知 --- */
        #toast {
            visibility: hidden; min-width: 250px; background-color: rgba(16, 185, 129, 0.95); color: #fff;
            text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 100;
            left: 50%; top: 30px; transform: translateX(-50%); font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); backdrop-filter: blur(5px);
            opacity: 0; transition: opacity 0.3s, top 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; top: 50px; }
        #toast.error { background-color: rgba(239, 68, 68, 0.95); }

        /* --- 移动端适配 --- */
        .mobile-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 25;
            display: none; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(3px);
        }
        .mobile-overlay.active { display: block; opacity: 1; }
        .mobile-toggle { display: none; font-size: 1.2rem; color: white; cursor: pointer; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; height: 100%; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .mobile-toggle { display: block; }
            .topbar { padding: 0 15px; }
            .scroll-area { padding: 20px 15px; }
            .form-grid { grid-template-columns: 1fr; }
            .vip-card { margin-bottom: 40px; } /* safe area */
        }
    </style>
</head>
<body>

    <div id="toast">Notification</div>

    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="brand"><i class="fas fa-terminal"></i> Command<span>OS</span></div>
            
            <div class="menu-scroll">
                <div class="menu-category">Generative Studio</div>
                <div class="menu-item active" onclick="loadTool('visual')"><i class="fas fa-camera"></i> Visual (视觉)</div>
                <div class="menu-item" onclick="loadTool('video')"><i class="fas fa-video"></i> Video (视频)</div>
                <div class="menu-item" onclick="loadTool('text')"><i class="fas fa-pen-nib"></i> Writing (写作)</div>
                
                <div class="menu-category">Social Matrix</div>
                <div class="menu-item" onclick="loadTool('xhs')"><i class="fab fa-instagram"></i> Xiaohongshu (小红书)</div>
                <div class="menu-item" onclick="loadTool('tiktok')"><i class="fab fa-tiktok"></i> TikTok (短视频)</div>
                <div class="menu-item" onclick="loadTool('email')"><i class="fas fa-envelope"></i> Sales Email (销售)</div>
                
                <div class="menu-category">Resources</div>
                <div class="menu-item" onclick="loadTool('library')"><i class="fas fa-book"></i> Prompt Library (词库)</div>
                <div class="menu-item" onclick="loadTool('reverse')"><i class="fas fa-magic"></i> Reverse Eng. (逆向)</div>
                <div class="menu-item" onclick="loadTool('history')"><i class="fas fa-history"></i> History (历史)</div>
            </div>

            <div class="vip-card">
                <div class="vip-title"><i class="fas fa-crown"></i> VIP 资料包</div>
                <div class="vip-desc">
                    含 5000+ 条汉化 Prompt 数据库 (Excel) + PDF 教程 + 源码
                </div>
                <button class="btn-vip" onclick="getWeChat()">
                    📥 免费获取 (点击复制)
                </button>
            </div>
        </div>

        <div class="mobile-overlay" id="overlay" onclick="closeSidebar()"></div>

        <div class="workspace">
            <div class="topbar">
                <div style="display:flex; gap:15px; align-items:center;">
                    <i class="fas fa-bars mobile-toggle" onclick="openSidebar()"></i>
                    <span style="font-weight:bold; font-size:1.1rem; letter-spacing:0.5px;" id="toolTitle">Visual Director</span>
                </div>
                
                <div class="model-badge" id="modelSelectContainer">
                    <i class="fas fa-robot" style="color:var(--accent)"></i>
                    <select id="targetModel"></select>
                </div>
            </div>

            <div class="scroll-area">
                <div id="dynamicForm" class="form-grid"></div>
                
                <div id="historyList" style="display:none;"></div>

                <div class="action-bar" id="actionBar">
                    <div style="display:flex; align-items:center; gap:10px; cursor:pointer;" id="abTestGroup">
                        <input type="checkbox" id="abTest" style="width:16px; height:16px; accent-color:var(--accent);">
                        <label for="abTest" style="margin:0; cursor:pointer; font-weight:normal;">A/B Test Mode</label>
                    </div>
                    <button class="btn-main" id="actionBtn" onclick="generate()">
                        <i class="fas fa-bolt"></i> Generate (立即生成)
                    </button>
                </div>

                <div id="outputHeader" style="display:flex; justify-content:space-between; margin-bottom:15px; color:var(--text-sub); font-size:0.8rem; font-weight:bold; text-transform:uppercase;">
                    <span>Output Terminal</span>
                    <span style="cursor:pointer; color:var(--accent);" onclick="clearResults()">Clear</span>
                </div>
                <div id="resultContainer" class="result-container"></div>
            </div>
        </div>
    </div>

    <script>
        // === 1. 数据定义 ===
        const libraryGroups = {
            "🎨 Visual Art": {
                'MJ Portrait': "/imagine prompt: extreme close-up portrait of [Subject], natural lighting, 85mm lens, f/1.8, detailed skin texture --v 6.0 --style raw",
                'MJ Logo': "/imagine prompt: minimalist vector logo of [Subject], negative space, geometric shapes, white background --v 6.0",
                'MJ 3D Icon': "/imagine prompt: 3d glass icon of [Subject], frosted glass, soft gradient, macos big sur style, white background --v 6.0"
            },
            "📝 Social Media": {
                'Xiaohongshu': "Title: [Emoji] [Title]\n\n[Body Content]\n\nTags: #Xiaohongshu #Trend",
                'LinkedIn': "Hook: [Problem]\nInsight: [Solution]\nCall to Action: Thoughts?"
            }
        };

        const tools = {
            visual: {
                title: "Visual Director (视觉)",
                models: ['Midjourney V6', 'Niji V6', 'DALL-E 3', 'SDXL'],
                inputs: [
                    { id: 'subject', label: 'Subject (主体)', type: 'text', placeholder: 'e.g. A cyberpunk cat' },
                    { id: 'style', label: 'Art Style (风格)', type: 'select', options: ['Photorealistic (真实)', 'Cyberpunk (赛博朋克)', 'Anime (动漫)', '3D Render (3D)', 'Oil Painting (油画)', 'Minimalist (极简)']},
                    { id: 'lighting', label: 'Lighting (光影)', type: 'select', options: ['Cinematic (电影光)', 'Natural (自然光)', 'Neon (霓虹)', 'Volumetric (丁达尔)']},
                    { id: 'ar', label: 'Ratio (比例)', type: 'select', options: ['--ar 16:9 (横屏)', '--ar 9:16 (竖屏)', '--ar 1:1 (方图)', '--ar 4:3']}
                ]
            },
            xhs: {
                title: "Xiaohongshu (小红书)",
                models: ['Claude 3 (Vibe)', 'GPT-4'],
                inputs: [
                    { id: 'topic', label: 'Topic (选题)', type: 'text', placeholder: 'e.g. 减肥食谱' },
                    { id: 'niche', label: 'Niche (赛道)', type: 'select', options: ['Beauty (美妆)', 'Fashion (穿搭)', 'Food (美食)', 'Travel (旅行)', 'Tech (数码)']},
                    { id: 'title_style', label: 'Title (标题)', type: 'select', options: ['Emotional (情绪化)', 'Warning (避雷)', 'List (盘点)', 'Tutorial (教程)']},
                    { id: 'emoji', label: 'Emoji (浓度)', type: 'select', options: ['Standard (标准)', 'Heavy (氛围感)', 'Minimal (极简)']}
                ]
            },
            text: {
                title: "Copywriter (写作)",
                models: ['GPT-4o', 'Claude 3'],
                inputs: [
                    { id: 'topic', label: 'Topic (主题)', type: 'text', placeholder: 'e.g. AI Trends' },
                    { id: 'type', label: 'Type (类型)', type: 'select', options: ['Blog Post', 'Tweet', 'Script', 'Email']},
                    { id: 'tone', label: 'Tone (语气)', type: 'select', options: ['Professional', 'Humorous', 'Urgent', 'Empathetic']}
                ]
            },
            tiktok: {
                title: "TikTok Script (短视频)",
                models: ['GPT-4o', 'Claude 3'],
                inputs: [
                    { id: 'topic', label: 'Topic (主题)', type: 'text', placeholder: 'e.g. iPhone Review' },
                    { id: 'hook', label: 'Hook (开头)', type: 'select', options: ['Visual Shock', 'Controversial', 'Question', 'Story']},
                    { id: 'duration', label: 'Duration (时长)', type: 'select', options: ['15s', '30s', '60s']}
                ]
            },
            email: {
                title: "Sales Email (外贸)",
                models: ['GPT-4o (Sales)'],
                inputs: [
                    { id: 'product', label: 'Product (产品)', type: 'text' },
                    { id: 'role', label: 'To (收件人)', type: 'select', options: ['CEO', 'Purchasing Manager', 'Marketing Director']},
                    { id: 'framework', label: 'Model (框架)', type: 'select', options: ['AIDA', 'PAS', 'Direct Pitch']}
                ]
            },
            video: {
                title: "Video Gen (AI视频)",
                models: ['Runway Gen-2', 'Pika'],
                inputs: [
                    { id: 'prompt', label: 'Prompt (画面)', type: 'text' },
                    { id: 'camera', label: 'Camera (运镜)', type: 'select', options: ['Pan Left', 'Zoom In', 'Orbit', 'Static']}
                ]
            },
            library: { title: "Prompt Library (词库)", models: ['Universal'], inputs: [{ id: 'template', label: 'Template (模版)', type: 'select', options: [] }] },
            reverse: { title: "Reverse Engineering (逆向)", models: ['GPT-4 Vision'], inputs: [{ id: 'desc', label: 'Image Desc (描述)', type: 'text', placeholder: 'Describe the image...' }] },
            history: { title: "History (历史记录)", models: [], inputs: [] }
        };

        let currentTool = 'visual';

        // === 2. 初始化逻辑 ===
        window.onload = () => { loadTool('visual'); };

        function loadTool(key) {
            currentTool = key;
            const data = tools[key];
            
            // UI 更新
            document.getElementById('toolTitle').innerText = data.title;
            const modelSelect = document.getElementById('targetModel');
            
            // 更新模型选择
            if(data.models.length > 0) {
                document.getElementById('modelSelectContainer').style.display = 'flex';
                modelSelect.innerHTML = data.models.map(m => `<option>${m}</option>`).join('');
            } else {
                document.getElementById('modelSelectContainer').style.display = 'none';
            }

            // 菜单高亮
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => {
                if(item.getAttribute('onclick').includes(key)) item.classList.add('active');
            });

            // 移动端收起菜单
            if(window.innerWidth <= 768) closeSidebar();

            renderInterface(key, data);
        }

        function renderInterface(key, data) {
            const formGrid = document.getElementById('dynamicForm');
            const historyList = document.getElementById('historyList');
            const actionBar = document.getElementById('actionBar');
            const outputHeader = document.getElementById('outputHeader');
            const resultContainer = document.getElementById('resultContainer');

            // 重置视图
            formGrid.style.display = 'none';
            historyList.style.display = 'none';
            actionBar.style.display = 'flex';
            outputHeader.style.display = 'flex';
            resultContainer.style.display = 'flex';
            document.getElementById('abTestGroup').style.display = 'flex';

            if (key === 'history') {
                historyList.style.display = 'block';
                actionBar.style.display = 'none';
                outputHeader.style.display = 'none';
                resultContainer.style.display = 'none';
                renderHistory();
                return;
            }

            formGrid.style.display = 'grid';
            formGrid.innerHTML = '';
            resultContainer.innerHTML = '';

            // 渲染输入框
            if(data.inputs) {
                data.inputs.forEach(field => {
                    const div = document.createElement('div');
                    div.className = 'input-group';
                    let inputHtml = '';
                    
                    if(field.type === 'select') {
                        if(key === 'library' && field.id === 'template') {
                            // 渲染词库选项
                            let optsHtml = '';
                            for(const [gName, gItems] of Object.entries(libraryGroups)) {
                                optsHtml += `<optgroup label="${gName}" style="color:var(--gold); background:var(--sidebar);">`;
                                for(const tName of Object.keys(gItems)) {
                                    optsHtml += `<option value="${tName}">${tName}</option>`;
                                }
                                optsHtml += `</optgroup>`;
                            }
                            inputHtml = `<select id="f_${field.id}" onchange="autoGenerateLibrary()">${optsHtml}</select>`;
                        } else {
                            const opts = field.options.map(o => `<option>${o}</option>`).join('');
                            inputHtml = `<select id="f_${field.id}">${opts}</select>`;
                        }
                    } else {
                        inputHtml = `<input type="text" id="f_${field.id}" placeholder="${field.placeholder || ''}">`;
                    }
                    div.innerHTML = `<label>${field.label}</label>${inputHtml}`;
                    formGrid.appendChild(div);
                });
            }

            // 按钮文字适配
            const btn = document.getElementById('actionBtn');
            if(key === 'library') {
                document.getElementById('abTestGroup').style.display = 'none';
                btn.innerHTML = '<i class="fas fa-copy"></i> Get Template (获取模版)';
                btn.classList.add('purple');
                setTimeout(autoGenerateLibrary, 100); // 自动加载第一个
            } else if (key === 'reverse') {
                document.getElementById('abTestGroup').style.display = 'none';
                btn.innerHTML = '<i class="fas fa-magic"></i> Analyze (开始分析)';
                btn.classList.remove('purple');
            } else {
                btn.innerHTML = '<i class="fas fa-bolt"></i> Generate (立即生成)';
                btn.classList.remove('purple');
            }
        }

        // === 3. 核心生成逻辑 ===
        function generate() {
            const toolData = tools[currentTool];
            const inputs = {};
            
            // 收集数据并清洗 (去除中文备注)
            if(toolData.inputs) {
                toolData.inputs.forEach(f => {
                    const el = document.getElementById(`f_${f.id}`);
                    if(el) {
                        let val = el.value;
                        if(f.type === 'select' && val.includes('(')) {
                            val = val.split('(')[0].trim();
                        }
                        inputs[f.id] = val;
                    }
                });
            }

            if(currentTool === 'reverse') {
                simulateReverse();
                return;
            }

            const prompt = buildPromptString(currentTool, inputs);
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';

            const isAB = document.getElementById('abTest').checked;
            
            if(isAB && currentTool !== 'library') {
                createResultBox("Version A (Standard)", prompt);
                createResultBox("Version B (Creative)", prompt + " --stylize 250 --weird 50");
            } else {
                createResultBox("Result", prompt);
            }

            saveToHistory(toolData.title, prompt);
            showToast("✅ Generated Successfully!", "success");
        }

        function buildPromptString(key, data) {
            if(key === 'visual') {
                return `/imagine prompt: ${data.subject}, ${data.style} style, ${data.lighting} lighting ${data.ar} --v 6.0`;
            } else if (key === 'xhs') {
                return `Role: Xiaohongshu Creator\nTopic: ${data.topic}\nNiche: ${data.niche}\nStyle: ${data.title_style}\n\n[Content Generation...]`;
            } else if (key === 'library') {
                // 查找模版
                for(const g of Object.values(libraryGroups)) {
                    if(g[data.template]) return g[data.template];
                }
                return "Template not found.";
            }
            return `### ${key.toUpperCase()} Task\nInput: ${JSON.stringify(data)}`;
        }

        function createResultBox(tag, text) {
            const box = document.createElement('div');
            box.className = 'result-box';
            // Store raw text in a data attribute for clean copying
            box.setAttribute('data-raw', text); 
            box.innerHTML = `
                <div class="ab-tag">${tag}</div>
                <button class="btn-copy" onclick="copyResult(this)"><i class="fas fa-copy"></i> Copy</button>
                ${text}
            `;
            document.getElementById('resultContainer').appendChild(box);
        }

        // 模拟逆向工程动画
        function simulateReverse() {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            const box = document.createElement('div');
            box.className = 'result-box';
            box.style.color = 'var(--text-sub)';
            container.appendChild(box);

            const steps = ["🔍 Scanning Image...", "🧠 Analyzing Style...", "🎨 Extracting Palette...", "✨ Done!"];
            let i = 0;
            const timer = setInterval(() => {
                if(i >= steps.length) {
                    clearInterval(timer);
                    box.style.color = 'var(--success)';
                    const res = "/imagine prompt: analyzed image content, cinematic lighting, 8k resolution --v 6.0";
                    box.setAttribute('data-raw', res);
                    box.innerHTML = `<div class="ab-tag">Analysis</div><button class="btn-copy" onclick="copyResult(this)"><i class="fas fa-copy"></i> Copy</button>${res}`;
                    showToast("Analysis Complete!");
                } else {
                    box.innerText = steps[i++];
                }
            }, 600);
        }

        function autoGenerateLibrary() {
            if(currentTool === 'library') generate();
        }

        // === 4. 工具函数 ===
        
        // 核心引流功能：复制微信号
        function getWeChat() {
            const wechatId = "zID0001";
            navigator.clipboard.writeText(wechatId).then(() => {
                showToast("✅ 微信号已复制: " + wechatId, "success");
                setTimeout(() => {
                    alert("👉 请去微信添加好友\n备注【PDF】\n即可领取 5000+ 词库！");
                }, 500);
            }).catch(() => {
                prompt("请手动复制微信号：", wechatId);
            });
        }

        // 纯净复制功能
        function copyResult(btn) {
            const box = btn.parentElement;
            const text = box.getAttribute('data-raw');
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied';
                btn.style.background = 'rgba(16, 185, 129, 0.2)';
                showToast("Copied to clipboard!");
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = 'rgba(255,255,255,0.1)';
                }, 2000);
            });
        }

        // Toast 通知
        function showToast(message, type = 'normal') {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = type === 'error' ? 'error show' : 'show';
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function clearResults() {
            document.getElementById('resultContainer').innerHTML = '';
        }

        // 历史记录
        function saveToHistory(type, content) {
            let h = JSON.parse(localStorage.getItem('cmd_history') || '[]');
            h.unshift({type, content, time: new Date().toLocaleTimeString()});
            if(h.length > 20) h.pop();
            localStorage.setItem('cmd_history', JSON.stringify(h));
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const h = JSON.parse(localStorage.getItem('cmd_history') || '[]');
            if(h.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:30px;">暂无历史记录</div>';
                return;
            }
            list.innerHTML = h.map(item => `
                <div class="result-box" style="margin-bottom:10px; min-height:auto; cursor:pointer;" onclick="navigator.clipboard.writeText(this.innerText);showToast('Copied!')">
                    <div style="font-size:0.75rem; color:var(--text-sub); margin-bottom:5px; display:flex; justify-content:space-between;">
                        <span>${item.type}</span><span>${item.time}</span>
                    </div>
                    ${item.content}
                </div>
            `).join('');
        }

        // 侧边栏控制
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('overlay').classList.add('active');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }
    </script>
</body>
</html>
