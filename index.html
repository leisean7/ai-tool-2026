<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CommandOS V22 | JSON双模版</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --sidebar: #151921;
            --panel: #222630;
            --input: #2f3442;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #e2e8f0;
            --text-sub: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
            --purple: #8b5cf6;
            --green: #10b981;
            --code-bg: #1e1e1e;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        /* --- 布局 --- */
        .app-container { display: flex; width: 100%; height: 100%; }
        
        /* 侧边栏 */
        .sidebar {
            width: 250px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
            overflow-y: auto;
        }

        .brand {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent); }

        .menu-category { padding: 20px 20px 8px; font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        
        .menu-item {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-sub);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: rgba(59, 130, 246, 0.15); color: var(--accent); border-left-color: var(--accent); }
        .menu-item i { width: 18px; text-align: center; }

        /* 工作区 */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
            position: relative;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg);
        }

        /* JSON Toggle Switch */
        .mode-switch {
            display: flex; align-items: center; gap: 8px; background: var(--input);
            padding: 4px; border-radius: 20px; border: 1px solid var(--border);
        }
        .mode-btn {
            padding: 4px 12px; border-radius: 16px; font-size: 0.75rem; font-weight: bold; cursor: pointer; color: var(--text-sub);
            transition: 0.2s;
        }
        .mode-btn.active { background: var(--accent); color: white; }
        .json-active .mode-btn.active { background: var(--gold); color: black; } /* JSON mode color */

        .scroll-area {
            flex: 1; overflow-y: auto; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%;
        }

        /* --- 词库 & 卡片 --- */
        .library-search { margin-bottom: 20px; position: sticky; top: 0; z-index: 10; background: var(--bg); padding-bottom: 10px; }
        .library-search input {
            padding: 12px; font-size: 1rem; border-radius: 8px; border-color: var(--accent);
            background: rgba(47, 52, 66, 0.8); backdrop-filter: blur(5px);
            width: 100%; color: white; border: 1px solid var(--border);
        }

        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }

        .prompt-card {
            background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px;
            cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 10px;
            position: relative; overflow: hidden;
        }
        .prompt-card:hover { border-color: var(--accent); transform: translateY(-2px); background: #2a2f3a; }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-title-text { font-weight: bold; color: var(--text); font-size: 0.95rem; }
        .card-tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        
        /* 标签颜色 */
        .tag-visual { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
        .tag-writing { background: rgba(16, 185, 129, 0.2); color: var(--green); }
        .tag-code { background: rgba(245, 158, 11, 0.2); color: var(--gold); }

        .card-preview {
            font-size: 0.8rem; color: var(--text-sub); line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
            font-family: 'Monaco', monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px;
        }

        /* 表单区域 */
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: var(--text-sub); font-size: 0.8rem; }
        input, select, textarea {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; font-family: inherit;
        }
        
        .action-bar { display: flex; gap: 15px; margin-top: 20px; }
        .btn-main {
            flex: 1; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        
        /* 结果框 */
        .result-box {
            background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
            padding: 15px; font-family: 'Monaco', monospace; color: #a78bfa;
            font-size: 0.85rem; line-height: 1.5; min-height: 80px; white-space: pre-wrap; position: relative; margin-top: 20px;
        }
        
        /* JSON Mode 特效 */
        .json-active .card-preview, .json-active .result-box { color: var(--gold); }
        .json-active .btn-main { background: var(--gold); color: black; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; height: 100%; transition: 0.3s; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .form-grid, .library-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="sidebar" id="sidebar">
            <div class="brand"><i class="fas fa-terminal"></i> Command<span>OS</span></div>
            
            <div class="menu-category">Quick Library (词库)</div>
            <div class="menu-item active" onclick="loadTool('library')"><i class="fas fa-th-large"></i> Prompt Vault</div>

            <div class="menu-category">Custom Generators (定制)</div>
            <div class="menu-item" onclick="loadTool('visual')"><i class="fas fa-camera"></i> 视觉 (Visual)</div>
            <div class="menu-item" onclick="loadTool('text')"><i class="fas fa-pen-nib"></i> 写作 (Writing)</div>
            <div class="menu-item" onclick="loadTool('code')"><i class="fas fa-code"></i> 代码 (Coding)</div>
            
            <div class="menu-category">Professional</div>
            <div class="menu-item" onclick="loadTool('email')"><i class="fas fa-envelope-open-text"></i> 外贸开发 (Sales)</div>
            <div class="menu-item" onclick="loadTool('xhs')"><i class="fab fa-instagram"></i> 小红书矩阵</div>
        </div>

        <div class="workspace">
            <div class="topbar">
                <div style="display:flex; gap:15px; align-items:center;">
                    <i class="fas fa-bars" onclick="document.getElementById('sidebar').classList.toggle('open')" style="color:white; cursor:pointer; font-size:1.2rem; display:none;"></i>
                    <span style="font-weight:bold; font-size:1.1rem;" id="toolTitle">Prompt Vault</span>
                </div>
                
                <div class="mode-switch" id="modeSwitch">
                    <div class="mode-btn active" id="btnText" onclick="setMode('text')">Text</div>
                    <div class="mode-btn" id="btnJson" onclick="setMode('json')">{ JSON }</div>
                </div>
            </div>

            <div class="scroll-area" id="mainArea">
                
                <div id="libraryView">
                    <div class="library-search">
                        <input type="text" id="libSearch" placeholder="🔍 Search prompts..." oninput="filterLibrary()">
                    </div>
                    <div class="library-grid" id="libraryGrid"></div>
                </div>

                <div id="generatorView" style="display:none;">
                    <div id="dynamicForm"></div>
                    <div class="action-bar">
                        <button class="btn-main" onclick="generate()">Generate Output</button>
                    </div>
                    <div id="resultContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === 全局状态 ===
        let isJsonMode = false;
        let currentTool = 'library';

        // === 1. 数据资产 (Prompt Data) ===
        const promptVault = [
            { 
                title: "Midjourney Photorealistic", 
                category: "visual", 
                tag: "Visual",
                params: { model: "Midjourney V6", aspect_ratio: "16:9", style: "raw" },
                content: "/imagine prompt: extreme close-up portrait of a woman, natural lighting, 85mm lens, f/1.8, detailed skin texture, cinematic atmosphere --v 6.0 --style raw" 
            },
            { 
                title: "Python Debugging Assistant", 
                category: "code", 
                tag: "Coding",
                params: { language: "Python", role: "Senior Engineer" },
                content: "Role: Python Expert\nTask: Analyze the code below for bugs.\n1. Identify the logical error.\n2. Explain the root cause.\n3. Provide fixed code.\n\n[Paste Code]" 
            },
            { 
                title: "Instagram/小红书 Caption", 
                category: "writing", 
                tag: "Social",
                params: { platform: "Xiaohongshu", tone: "Engaging" },
                content: "Role: Social Media Manager\nTask: Write a viral caption about [Topic].\nRequirements:\n- Use Emojis.\n- Engaging hook line.\n- Call to action at the end." 
            },
            { 
                title: "SQL Query Optimization", 
                category: "code", 
                tag: "Database",
                params: { dialect: "PostgreSQL", goal: "Performance" },
                content: "Role: DBA\nTask: Optimize this SQL query for speed. Suggest indexing strategies." 
            },
            { 
                title: "Cold Email Outreach", 
                category: "writing", 
                tag: "Sales",
                params: { framework: "AIDA", target: "B2B" },
                content: "Subject: Quick question about [Company]\n\nHi [Name],\n\nI noticed you're managing [Department]..." 
            }
        ];

        // === 2. 工具配置 ===
        const tools = {
            visual: { title: "Visual Generator", inputs: [{id:'subject', label:'Subject', type:'text'}, {id:'style', label:'Style', type:'select', options:['Cyberpunk','Photorealistic']}] },
            text: { title: "Writing Assistant", inputs: [{id:'topic', label:'Topic', type:'text'}, {id:'tone', label:'Tone', type:'select', options:['Professional','Funny']}] },
            code: { title: "Code Helper", inputs: [{id:'lang', label:'Language', type:'text'}, {id:'task', label:'Task', type:'textarea'}] },
            email: { title: "Sales Email", inputs: [{id:'product', label:'Product', type:'text'}, {id:'target', label:'Target Audience', type:'text'}] },
            xhs: { title: "Xiaohongshu Matrix", inputs: [{id:'topic', label:'Topic', type:'text'}] }
        };

        // === 初始化 ===
        window.onload = () => {
            renderLibrary();
            // 响应式处理
            if(window.innerWidth <= 768) {
                document.querySelector('.fa-bars').style.display = 'block';
            }
        };

        // === 模式切换逻辑 (核心) ===
        function setMode(mode) {
            isJsonMode = (mode === 'json');
            
            // UI 更新
            document.getElementById('btnText').className = isJsonMode ? 'mode-btn' : 'mode-btn active';
            document.getElementById('btnJson').className = isJsonMode ? 'mode-btn active' : 'mode-btn';
            
            if(isJsonMode) document.body.classList.add('json-active');
            else document.body.classList.remove('json-active');

            // 重新渲染当前视图以应用新格式
            if(currentTool === 'library') renderLibrary();
            // 如果在生成器页面，清除结果避免混淆
            if(currentTool !== 'library') document.getElementById('resultContainer').innerHTML = '';
        }

        // === 词库渲染 ===
        function renderLibrary(data = promptVault) {
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = '';
            
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'prompt-card';
                
                // 决定显示内容：文本还是 JSON
                let displayContent = item.content;
                if(isJsonMode) {
                    // 构建 JSON 对象
                    const jsonObj = {
                        name: item.title,
                        tags: [item.category, item.tag],
                        parameters: item.params,
                        prompt_template: item.content
                    };
                    displayContent = JSON.stringify(jsonObj, null, 2);
                }

                card.onclick = () => copyContent(displayContent);

                // 标签样式
                let tagClass = 'tag-visual';
                if(item.category === 'code') tagClass = 'tag-code';
                if(item.category === 'writing') tagClass = 'tag-writing';

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-text">${item.title}</div>
                        <div class="card-tag ${tagClass}">${item.tag}</div>
                    </div>
                    <div class="card-preview">${displayContent}</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterLibrary() {
            const q = document.getElementById('libSearch').value.toLowerCase();
            const filtered = promptVault.filter(i => i.title.toLowerCase().includes(q) || i.content.toLowerCase().includes(q));
            renderLibrary(filtered);
        }

        // === 生成器逻辑 ===
        function loadTool(key) {
            currentTool = key;
            
            // 菜单高亮
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            const items = document.querySelectorAll('.menu-item');
            items.forEach(i => { if(i.getAttribute('onclick').includes(key)) i.classList.add('active'); });

            // 视图切换
            const lib = document.getElementById('libraryView');
            const gen = document.getElementById('generatorView');
            const title = document.getElementById('toolTitle');

            if(key === 'library') {
                lib.style.display = 'block'; gen.style.display = 'none';
                title.innerText = "Prompt Vault";
                renderLibrary();
            } else {
                lib.style.display = 'none'; gen.style.display = 'block';
                const data = tools[key];
                title.innerText = data.title;
                
                // 渲染表单
                const form = document.getElementById('dynamicForm');
                form.innerHTML = '';
                data.inputs.forEach(f => {
                    let html = `<div class="input-group"><label>${f.label}</label>`;
                    if(f.type==='select') html+=`<select id="f_${f.id}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`;
                    else if(f.type==='textarea') html+=`<textarea id="f_${f.id}" style="height:100px"></textarea>`;
                    else html+=`<input type="text" id="f_${f.id}">`;
                    html+=`</div>`;
                    form.innerHTML += html;
                });
                document.getElementById('resultContainer').innerHTML = '';
            }

            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function generate() {
            const toolData = tools[currentTool];
            const inputs = {};
            
            // 收集数据
            toolData.inputs.forEach(f => {
                inputs[f.id] = document.getElementById(`f_${f.id}`).value;
            });

            const container = document.getElementById('resultContainer');
            let output = "";

            if(isJsonMode) {
                // JSON 模式输出
                const jsonOutput = {
                    tool: tools[currentTool].title,
                    timestamp: new Date().toISOString(),
                    parameters: inputs,
                    generated_prompt: buildTextPrompt(currentTool, inputs) // 包含文本Prompt作为字段
                };
                output = JSON.stringify(jsonOutput, null, 2);
            } else {
                // 文本模式输出
                output = buildTextPrompt(currentTool, inputs);
            }

            container.innerHTML = `<div class="result-box">${output}</div>`;
        }

        function buildTextPrompt(key, data) {
            if(key === 'visual') return `/imagine prompt: ${data.subject}, ${data.style} style, 8k resolution, highly detailed --v 6.0`;
            if(key === 'text') return `Write a ${data.tone} article about ${data.topic}.`;
            if(key === 'code') return `Language: ${data.lang}\nTask: ${data.task}\n\nPlease provide clean, commented code.`;
            return `Task: ${tools[key].title}\nContext: ${JSON.stringify(data)}`;
        }

        function copyContent(text) {
            navigator.clipboard.writeText(text);
            alert(isJsonMode ? "JSON Copied!" : "Text Copied!");
        }
    </script>
</body>
</html>
