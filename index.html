<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CommandOS V14 | 全功能完全体</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --sidebar: #1e293b;
            --panel: #334155;
            --input: #475569;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #475569;
            --green: #10b981;
            --purple: #8b5cf6;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        /* --- 布局结构 --- */
        .app-container { display: flex; width: 100%; height: 100%; }
        
        /* 1. 左侧导航 */
        .sidebar {
            width: 240px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
            overflow-y: auto;
        }

        .brand {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent); }

        .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-sub);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: rgba(59, 130, 246, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .menu-category { padding: 20px 20px 5px; font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; font-weight: bold; }

        /* 2. 中间工作区 */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
            position: relative;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg);
        }

        .model-selector select {
            background: var(--panel); color: white; border: 1px solid var(--border);
            padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
        }

        .scroll-area {
            flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%;
        }

        /* 3. 右侧上下文 (品牌DNA) - 现在可用了 */
        .context-panel {
            width: 280px;
            background: var(--sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 20px;
            overflow-y: auto;
        }

        /* --- 组件样式 --- */
        .card-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; color: var(--text-sub); display: flex; justify-content: space-between; }

        label { display: block; margin-bottom: 8px; color: var(--text-sub); font-size: 0.85rem; }
        input, select, textarea {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; font-family: inherit; margin-bottom: 15px;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #475569; }

        /* 魔法扩写按钮 */
        .input-group { position: relative; }
        .magic-btn {
            position: absolute; right: 8px; top: 30px;
            background: transparent; border: none; color: var(--purple);
            cursor: pointer; font-size: 1rem; padding: 5px;
        }
        .magic-btn:hover { transform: scale(1.1); color: #d8b4fe; }

        /* 底部操作栏 */
        .action-bar { display: flex; gap: 15px; align-items: center; margin-top: 10px; padding-bottom: 20px; }
        .btn-main {
            flex: 1; padding: 12px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .btn-main:hover { background: var(--accent-hover); transform: translateY(-1px); }
        
        .switch-group { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 0.9rem; cursor: pointer; user-select: none; }
        .switch-group input { width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: var(--accent); }

        /* 结果区域 */
        .result-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .result-box {
            background: #000; border: 1px solid var(--border); border-radius: 8px;
            padding: 15px; font-family: 'Monaco', monospace; color: #a78bfa;
            font-size: 0.85rem; line-height: 1.5; min-height: 100px; white-space: pre-wrap; position: relative;
        }
        .ab-tag {
            position: absolute; top: 0; left: 0; background: var(--panel); 
            padding: 2px 8px; font-size: 0.7rem; border-bottom-right-radius: 6px; color: var(--text-sub); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
        }

        /* 移动端适配 */
        .mobile-toggle { display: none; font-size: 1.2rem; color: white; cursor: pointer; }
        @media (max-width: 1024px) {
            .context-panel { display: none; } /* 平板隐藏右侧 */
        }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; height: 100%; transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .mobile-toggle { display: block; }
            .topbar { padding: 0 15px; }
            .scroll-area { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="sidebar" id="sidebar">
            <div class="brand"><i class="fas fa-cube"></i> Command<span>OS</span></div>
            
            <div class="menu-category">核心创作 (Create)</div>
            <div class="menu-item active" onclick="loadTool('visual')"><i class="fas fa-camera"></i> 视觉指令台</div>
            <div class="menu-item" onclick="loadTool('text')"><i class="fas fa-pen-nib"></i> 爆文写作台</div>
            
            <div class="menu-category">效率增强 (Workflow)</div>
            <div class="menu-item" onclick="loadTool('reverse')"><i class="fas fa-code-branch"></i> 提示词反推 (Reverse)</div>
            <div class="menu-item" onclick="loadTool('academic')"><i class="fas fa-graduation-cap"></i> 学术降重/润色</div>
            <div class="menu-item" onclick="loadTool('email')"><i class="fas fa-envelope-open-text"></i> 外贸开发信</div>
            
            <div class="menu-category">垂直矩阵 (Matrix)</div>
            <div class="menu-item" onclick="loadTool('xhs')"><i class="fab fa-instagram"></i> 小红书矩阵</div>
            <div class="menu-item" onclick="loadTool('tiktok')"><i class="fab fa-tiktok"></i> 抖音脚本</div>
        </div>

        <div class="workspace">
            <div class="topbar">
                <div style="display:flex; gap:15px; align-items:center;">
                    <i class="fas fa-bars mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"></i>
                    <span style="font-weight:bold; font-size:1.1rem;" id="toolTitle">视觉指令台</span>
                </div>
                <div class="model-selector">
                    <select id="targetModel">
                        <option value="mj">Midjourney V6</option>
                        <option value="sd">Stable Diffusion</option>
                        <option value="dalle">DALL-E 3</option>
                        <option value="gpt">GPT-4 (文本)</option>
                    </select>
                </div>
            </div>

            <div class="scroll-area">
                <div id="dynamicForm"></div>

                <div class="action-bar">
                    <div class="switch-group" title="生成3个不同版本">
                        <input type="checkbox" id="abTest"> <span>启用 A/B 测试 (3版)</span>
                    </div>
                    <button class="btn-main" onclick="generate()">
                        <i class="fas fa-bolt"></i> 立即生成
                    </button>
                </div>

                <div style="margin-top: 10px;">
                    <div class="card-title">
                        <span>生成结果</span>
                        <span style="font-size:0.8rem; cursor:pointer; color:var(--accent);" onclick="clearResults()">清空</span>
                    </div>
                    <div id="resultContainer" class="result-container">
                        <div class="result-box" style="color:var(--text-sub); text-align:center; padding-top:40px;">
                            请在左侧选择工具，配置参数后点击生成。<br>右侧面板可设置“品牌DNA”自动注入。
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="context-panel">
            <div class="card-title">
                <span>🧬 品牌 DNA (Memory)</span>
                <i class="fas fa-check-circle" style="color:var(--green); font-size:0.8rem;"> Active</i>
            </div>
            <p style="font-size:0.8rem; color:var(--text-sub); margin-bottom:15px;">
                在此输入的信息将自动注入到所有指令中，确保风格统一。
            </p>
            
            <label>品牌/视觉主色 (Brand Color)</label>
            <input type="text" id="dnaColor" placeholder="e.g. Neon Blue & Black">

            <label>目标受众 (Target Audience)</label>
            <input type="text" id="dnaTarget" placeholder="e.g. 20-30岁 科技爱好者">

            <label>语气基调 (Tone of Voice)</label>
            <select id="dnaTone">
                <option value="">-- 默认 --</option>
                <option value="Professional">专业严谨</option>
                <option value="Humorous">幽默风趣</option>
                <option value="Empathetic">共情治愈</option>
                <option value="Luxurious">高端奢华</option>
            </select>

            <label>负向/禁用词 (Negative)</label>
            <textarea id="dnaNegative" placeholder="不希望出现的元素..." style="height:60px;"></textarea>

            <div style="font-size:0.75rem; color:var(--text-sub); margin-top:10px; border-top:1px solid var(--border); padding-top:10px;">
                *设置已自动保存，下次生成时生效。
            </div>
        </div>

    </div>

    <script>
        // === 数据配置 ===
        const tools = {
            visual: {
                title: "视觉指令台 (Visual)",
                type: 'visual',
                inputs: [
                    { id: 'subject', label: '画面主体', type: 'text', placeholder: 'e.g. 一只赛博朋克风格的猫', magic: true },
                    { id: 'style', label: '艺术风格', type: 'select', options: ['Photorealistic (真实摄影)', 'Cyberpunk (赛博朋克)', 'Ghibli Studio (吉卜力)', '3D Render (C4D)', 'Oil Painting (油画)', 'Minimalist Vector (极简矢量)'] },
                    { id: 'light', label: '光影设定', type: 'select', options: ['Cinematic Lighting (电影光)', 'Natural Light (自然光)', 'Neon Lights (霓虹光)', 'Rembrandt (伦勃朗光)', 'Volumetric (丁达尔光)'] },
                    { id: 'view', label: '构图/视角', type: 'select', options: ['Wide Angle (广角)', 'Close-up (特写)', 'Drone View (上帝视角)', 'Isometric (等轴测)', 'Macro (微距)'] }
                ]
            },
            text: {
                title: "爆文写作台 (Copywriting)",
                type: 'text',
                inputs: [
                    { id: 'topic', label: '写作主题', type: 'text', placeholder: 'e.g. 居家办公指南', magic: true },
                    { id: 'framework', label: '写作框架', type: 'select', options: ['AIDA (注意-兴趣-欲望-行动)', 'SCQA (情境-冲突-问题-答案)', 'PAS (痛点-加剧-解法)'] },
                    { id: 'length', label: '篇幅长短', type: 'select', options: ['Short (短帖/推文)', 'Medium (公众号/博客)', 'Long (深度长文)'] }
                ]
            },
            reverse: {
                title: "提示词反推 (Reverse Engineering)",
                type: 'text',
                inputs: [
                    { id: 'raw', label: '输入一段描述或文案', type: 'textarea', placeholder: '粘贴你想模仿的文案风格，或者描述一张你想复刻的图片...', height: '120px' },
                    { id: 'mode', label: '分析模式', type: 'select', options: ['Extract Visual Prompts (提取画面元素)', 'Analyze Writing Style (分析写作风格)'] }
                ]
            },
            academic: {
                title: "学术降重/润色",
                type: 'text',
                inputs: [
                    { id: 'content', label: '原文内容', type: 'textarea', placeholder: '粘贴需要降重或润色的论文段落...', height: '150px' },
                    { id: 'goal', label: '优化目标', type: 'select', options: ['Reduce Repetition (降重/去AI化)', 'Polish Grammar (润色语法)', 'Make more Academic (学术化)'] }
                ]
            },
            email: {
                title: "外贸开发信 (Cold Email)",
                type: 'text',
                inputs: [
                    { id: 'product', label: '推销产品', type: 'text', placeholder: 'e.g. Solar Panels' },
                    { id: 'client', label: '客户类型', type: 'text', placeholder: 'e.g. Distributors in Europe' },
                    { id: 'offer', label: '核心优势', type: 'text', placeholder: 'e.g. 10% Discount, Fast Shipping' }
                ]
            },
            xhs: {
                title: "小红书矩阵",
                type: 'text',
                inputs: [
                    { id: 'product', label: '种草产品', type: 'text', placeholder: 'e.g. 降噪耳机' },
                    { id: 'pain', label: '用户痛点', type: 'text', placeholder: 'e.g. 宿舍太吵，睡不着' }
                ]
            },
            tiktok: {
                title: "抖音脚本",
                type: 'text',
                inputs: [
                    { id: 'content', label: '核心内容', type: 'text', placeholder: 'e.g. iPhone 15 开箱' },
                    { id: 'hook', label: '开头钩子', type: 'select', options: ['视觉冲击', '反直觉暴论', '悬念提问'] }
                ]
            }
        };

        let currentTool = 'visual';

        // === 初始化 ===
        window.onload = () => loadTool('visual');

        function loadTool(key) {
            currentTool = key;
            const data = tools[key];
            
            document.getElementById('toolTitle').innerText = data.title;
            
            // 渲染表单
            const container = document.getElementById('dynamicForm');
            container.innerHTML = '';
            
            data.inputs.forEach(field => {
                const div = document.createElement('div');
                div.className = 'input-group';
                
                let inputHtml = '';
                if(field.type === 'select') {
                    const opts = field.options.map(o => `<option>${o}</option>`).join('');
                    inputHtml = `<select id="f_${field.id}">${opts}</select>`;
                } else if (field.type === 'textarea') {
                    inputHtml = `<textarea id="f_${field.id}" placeholder="${field.placeholder}" style="height:${field.height || '80px'}"></textarea>`;
                } else {
                    inputHtml = `<input type="text" id="f_${field.id}" placeholder="${field.placeholder}">`;
                }

                let magicBtn = '';
                if(field.magic) {
                    magicBtn = `<button class="magic-btn" onclick="magicExpand('f_${field.id}')" title="AI 一键扩写"><i class="fas fa-magic"></i></button>`;
                }

                div.innerHTML = `<label>${field.label}</label>${inputHtml}${magicBtn}`;
                container.appendChild(div);
            });

            // 菜单高亮更新
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            // 简单逻辑：找到包含当前key的menu item
            const items = document.querySelectorAll('.menu-item');
            items.forEach(item => {
                if(item.getAttribute('onclick').includes(key)) item.classList.add('active');
            });
            
            // 手机端自动收起侧边栏
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        // 1. 魔法扩写 (Translation Layer)
        function magicExpand(inputId) {
            const input = document.getElementById(inputId);
            const val = input.value;
            if(!val) { input.value = "Cyberpunk city street, rain, neon lights"; return; }
            
            // 简单模拟扩写逻辑
            const expansions = [
                ", highly detailed, 8k resolution, cinematic lighting, masterpiece",
                ", trending on artstation, intricate details, sharp focus",
                ", professional photography, depth of field, vivid colors"
            ];
            input.value = val + expansions[Math.floor(Math.random() * expansions.length)];
        }

        // 2. 核心生成逻辑 (Engine)
        function generate() {
            const model = document.getElementById('targetModel').value;
            const isAB = document.getElementById('abTest').checked;
            const toolData = tools[currentTool];
            
            // 获取 DNA 数据 (Context Layer)
            const dna = {
                color: document.getElementById('dnaColor').value,
                target: document.getElementById('dnaTarget').value,
                tone: document.getElementById('dnaTone').value,
                negative: document.getElementById('dnaNegative').value
            };

            // 获取输入数据
            const inputs = {};
            toolData.inputs.forEach(f => {
                inputs[f.id] = document.getElementById(`f_${f.id}`).value;
            });

            // 清空结果区并显示 Loading
            const container = document.getElementById('resultContainer');
            container.innerHTML = '<div class="result-box" style="display:flex;align-items:center;justify-content:center;color:var(--text-sub);"><i class="fas fa-spinner fa-spin"></i> AI 正在思考并注入品牌DNA...</div>';

            setTimeout(() => {
                container.innerHTML = ''; // 清除 Loading

                // 如果开启 A/B 测试，生成 3 个版本；否则 1 个
                const versions = isAB ? ['Standard (标准版)', 'Creative (创意版)', 'Minimalist (极简版)'] : ['Result (生成结果)'];
                
                versions.forEach(ver => {
                    const prompt = buildPrompt(toolData.type, model, inputs, dna, ver);
                    
                    const box = document.createElement('div');
                    box.className = 'result-box';
                    box.innerHTML = `<div class="ab-tag">${ver}</div>${prompt} <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                    container.appendChild(box);
                });

            }, 800);
        }

        // 构建 Prompt 字符串 (核心算法)
        function buildPrompt(type, model, inputs, dna, version) {
            let res = "";
            let dnaStr = "";
            
            // 注入品牌 DNA
            if(dna.color) dnaStr += `Brand Colors: ${dna.color} | `;
            if(dna.target) dnaStr += `Audience: ${dna.target} | `;
            if(dna.tone && type === 'text') dnaStr += `Tone: ${dna.tone} | `;
            
            // 根据 A/B 版本微调
            let nuance = "";
            if(version.includes("Creative")) nuance = "Make it artistic, abstract, and unique.";
            if(version.includes("Minimalist")) nuance = "Keep it simple, clean, and minimal.";

            if (type === 'visual') {
                let base = Object.values(inputs).join(', ');
                if(dnaStr) base += `, (${dnaStr})`;
                if(nuance) base += `, ${nuance}`;

                if (model === 'mj') {
                    res = `/imagine prompt: ${base} --v 6.0 --ar 16:9 --style raw`;
                    if(dna.negative) res += ` --no ${dna.negative}`;
                } else {
                    res = `(masterpiece), ${base}, 8k uhd`;
                    if(dna.negative) res += `, (negative prompt: ${dna.negative})`;
                }
            } else {
                // 文本类
                res = `### Role: AI Expert\n### Task: ${tools[currentTool].title}\n### Context (Brand DNA): ${dnaStr}\n### Inputs: ${Object.values(inputs).join(' | ')}\n### Style Goal: ${version}\n\n[Please generate the content now, optimized for ${model.toUpperCase()}]`;
            }
            return res;
        }

        function copyText(icon) {
            const text = icon.parentElement.innerText.replace("Result", "").trim();
            navigator.clipboard.writeText(text);
            alert("已复制！");
        }

        function clearResults() {
            document.getElementById('resultContainer').innerHTML = '';
        }

    </script>
</body>
</html>
