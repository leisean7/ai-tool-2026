<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CommandOS V26 | 现实世界全参数版</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --sidebar: #151921;
            --panel: #222630;
            --input: #2f3442;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #e2e8f0;
            --text-sub: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
            --purple: #8b5cf6;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        /* --- 布局结构 --- */
        .app-container { display: flex; width: 100%; height: 100%; }
        
        /* 1. 左侧导航 */
        .sidebar {
            width: 260px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
            overflow-y: auto;
        }

        .brand {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent); }

        .menu-category { padding: 20px 20px 8px; font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        
        .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-sub);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: rgba(59, 130, 246, 0.15); color: var(--accent); border-left-color: var(--accent); }
        .menu-item i { width: 18px; text-align: center; }

        /* 2. 中间工作区 */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
            position: relative;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: var(--bg);
        }

        .model-selector select {
            background: var(--panel); color: white; border: 1px solid var(--border);
            padding: 8px 15px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
        }

        .scroll-area {
            flex: 1; overflow-y: auto; padding: 30px; max-width: 1000px; margin: 0 auto; width: 100%;
        }

        /* --- 基础组件 --- */
        .card-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 20px; color: var(--text-sub); display: flex; justify-content: space-between; text-transform: uppercase; align-items: center;}
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group { position: relative; }
        
        label { display: block; margin-bottom: 8px; color: var(--text-sub); font-size: 0.85rem; font-weight: 500; }
        input, select, textarea {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            color: white; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-family: inherit; margin-bottom: 0;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #3b4050; }

        .magic-btn {
            position: absolute; right: 10px; top: 32px;
            background: transparent; border: none; color: var(--gold);
            cursor: pointer; font-size: 1rem; padding: 4px;
        }
        .magic-btn:hover { transform: scale(1.1); }

        .action-bar { display: flex; gap: 20px; align-items: center; margin-top: 10px; padding-bottom: 30px; }
        .btn-main {
            flex: 1; padding: 14px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2); font-size: 1rem;
        }
        .btn-main:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-main.purple { background: var(--purple); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2); }
        .btn-main.purple:hover { background: #7c3aed; }
        
        .switch-group { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 0.9rem; cursor: pointer; user-select: none; }
        .switch-group input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px;}

        /* 结果展示 */
        .result-container { display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }
        .result-box {
            background: #000; border: 1px solid var(--border); border-radius: 8px;
            padding: 20px; font-family: 'Monaco', monospace; color: #10b981;
            font-size: 0.9rem; line-height: 1.6; min-height: 100px; white-space: pre-wrap; position: relative;
        }
        .ab-tag {
            position: absolute; top: 0; left: 0; background: var(--panel); 
            padding: 4px 10px; font-size: 0.75rem; border-bottom-right-radius: 6px; color: var(--text-sub); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
        }

        /* 上传区域 */
        .upload-zone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 30px;
            text-align: center; color: var(--text-sub); cursor: pointer;
            transition: 0.2s; background: rgba(0,0,0,0.2);
            margin-bottom: 25px; display: none;
        }
        .upload-zone:hover { border-color: var(--accent); color: var(--accent); background: rgba(59, 130, 246, 0.05); }
        .file-name { margin-top: 10px; font-size: 0.85rem; color: var(--gold); display: none; font-weight: bold;}

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; height: 100%; transition: 0.3s; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .mobile-toggle { display: block; }
            .topbar { padding: 0 15px; }
            .scroll-area { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
        }
        .mobile-toggle { display: none; font-size: 1.2rem; color: white; cursor: pointer; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="sidebar" id="sidebar">
            <div class="brand"><i class="fas fa-terminal"></i> Command<span>OS</span></div>
            
            <div class="menu-category">Generative Studio</div>
            <div class="menu-item active" onclick="loadTool('visual')"><i class="fas fa-camera"></i> 视觉 (Visual)</div>
            <div class="menu-item" onclick="loadTool('video')"><i class="fas fa-video"></i> 视频 (Video)</div>
            <div class="menu-item" onclick="loadTool('audio')"><i class="fas fa-music"></i> 音乐 (Audio)</div>
            <div class="menu-item" onclick="loadTool('text')"><i class="fas fa-pen-nib"></i> 写作 (Copy)</div>
            
            <div class="menu-category">Professional Matrix</div>
            <div class="menu-item" onclick="loadTool('tiktok')"><i class="fab fa-tiktok"></i> 抖音/TikTok</div>
            <div class="menu-item" onclick="loadTool('xhs')"><i class="fab fa-instagram"></i> 小红书矩阵</div>
            <div class="menu-item" onclick="loadTool('academic')"><i class="fas fa-graduation-cap"></i> 学术科研 (Scholar)</div>
            <div class="menu-item" onclick="loadTool('email')"><i class="fas fa-envelope-open-text"></i> 外贸开发 (Sales)</div>
            
            <div class="menu-category">AI Resources</div>
            <div class="menu-item" onclick="loadTool('library')"><i class="fas fa-book"></i> 经典词库 (Templates)</div>
            <div class="menu-item" onclick="loadTool('reverse')"><i class="fas fa-upload"></i> 逆向工程 (Reverse)</div>
        </div>

        <div class="workspace">
            <div class="topbar">
                <div style="display:flex; gap:15px; align-items:center;">
                    <i class="fas fa-bars mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"></i>
                    <span style="font-weight:bold; font-size:1.1rem;" id="toolTitle">视觉指令台</span>
                </div>
                <div class="model-selector">
                    <select id="targetModel">
                        </select>
                </div>
            </div>

            <div class="scroll-area">
                
                <div id="uploadArea" class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-cloud-upload-alt" style="font-size:2rem; margin-bottom:10px;"></i>
                    <div>点击或拖拽上传图片</div>
                    <div id="fileNameDisplay" class="file-name"></div>
                    <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
                </div>

                <div id="dynamicForm" class="form-grid"></div>

                <div class="action-bar">
                    <div class="switch-group" id="abTestGroup">
                        <input type="checkbox" id="abTest"> <span>A/B 测试 (3版)</span>
                    </div>
                    <button class="btn-main" id="actionBtn" onclick="generate()">
                        <i class="fas fa-bolt"></i> 立即生成
                    </button>
                </div>

                <div class="card-title">
                    <span>Output Terminal</span>
                    <span style="font-size:0.75rem; cursor:pointer; color:var(--accent);" onclick="document.getElementById('resultContainer').innerHTML=''">Clear</span>
                </div>
                <div id="resultContainer" class="result-container"></div>
            </div>
        </div>

    </div>

    <script>
        // === 预设 S 级模版数据 ===
        const libraryTemplates = {
            '【🎨 视觉】MJ 摄影大师 (Portrait Master)': "/imagine prompt: extreme close-up portrait of a woman, natural lighting, 85mm lens, f/1.8, detailed skin texture, cinematic atmosphere, neutral background, shot on Hasselblad X2D --v 6.0 --style raw",
            '【🎨 视觉】MJ 极简 Logo (Minimalist Logo)': "/imagine prompt: minimalist vector logo of [Subject], negative space, geometric shapes, bauhaus style, white background, flat design, vector graphics --v 6.0 --no text shading details",
            '【🎨 视觉】MJ 泡泡玛特风 (Pop Mart 3D)': "/imagine prompt: cute 3d pop mart character, [Subject], clay material, pastel colors, soft studio lighting, 3d render, c4d, octane render, blind box toy --v 6.0 --niji 6",
            '【🎨 视觉】MJ 苹果风图标 (Apple 3D Icon)': "/imagine prompt: 3d glass icon of [Subject], apple design style, frosted glass, soft gradient, transparent, high gloss, macos big sur style, white background --v 6.0",
            '【📝 写作】小红书爆款 (Viral Note)': "Role: 小红书博主\nTask: 为[产品/主题]写一篇种草笔记。\n要求：\n1. 标题包含Emoji，吸引眼球。\n2. 正文分段，多用表情符号，语气亲切。\n3. 结尾引导评论和收藏。",
            '【📝 写作】学术论文润色 (Academic Polish)': "Role: Academic Editor\nTask: Polish the following text for a top-tier journal.\nRequirements: Enhance clarity, fix grammar, remove repetition, and ensure a formal academic tone.\nText:\n[Paste Text Here]",
            '【💻 编程】Python 除错 (Debugger)': "Role: Python Expert\nTask: Find the bug in this code and explain the fix.\nCode:\n[Paste Code Here]",
            '【🔧 实用】费曼学习法 (Feynman Tech)': "Role: Teacher\nTask: Explain [Complex Topic] to me as if I were a 12-year-old. Use analogies and simple language to ensure I understand the core concept."
        };

        // === 核心：现实世界全参数配置 ===
        const tools = {
            visual: {
                title: "Visual Director (视觉)",
                models: ['Midjourney V6', 'Niji V6', 'Stable Diffusion XL', 'DALL-E 3'],
                inputs: [
                    { id: 'subject', label: 'Subject (画面主体)', type: 'text', placeholder: 'e.g. 赛博朋克风格的猫', magic: true },
                    { id: 'style', label: 'Art Style (艺术风格)', type: 'select', options: [
                        'Photorealistic (真实摄影)', 'Cyberpunk (赛博朋克)', 'Anime/Manga (日系动漫)', '3D Render (3D渲染)', 
                        'Oil Painting (油画)', 'Watercolor (水彩)', 'Pixel Art (像素艺术)', 'Ukiyo-e (浮世绘)', 
                        'Vaporwave (蒸汽波)', 'Steampunk (蒸汽朋克)', 'Bauhaus (包豪斯)', 'Minimalist Vector (极简矢量)',
                        'Claymation (粘土动画)', 'Gothic (哥特风)', 'Surrealism (超现实主义)', 'Impressionism (印象派)'
                    ]},
                    { id: 'shot', label: 'Camera Shot (构图/运镜)', type: 'select', options: [
                        'Wide Angle (广角)', 'Ultra-Wide (超广角 14mm)', 'Telephoto (长焦 85mm)', 'Macro (微距)', 
                        'Drone View (上帝视角)', 'Isometric (等轴测)', 'Selfie (自拍)', 'Fisheye (鱼眼)', 
                        'Over-the-Shoulder (过肩镜头)', 'Low Angle (低角度仰拍)', 'Dutch Angle (荷兰式倾斜)', 'Eye-Level (平视)'
                    ]},
                    { id: 'light', label: 'Lighting (布光)', type: 'select', options: [
                        'Cinematic Lighting (电影光)', 'Natural Light (自然光)', 'Golden Hour (黄金时刻)', 'Blue Hour (蓝调时刻)', 
                        'Neon Lights (霓虹光)', 'Rembrandt Lighting (伦勃朗光)', 'Butterfly Lighting (蝴蝶光)', 'Split Lighting (侧逆光)',
                        'Volumetric/God Rays (丁达尔光)', 'Studio Softbox (影棚柔光)', 'Bioluminescent (生物荧光)'
                    ]},
                    { id: 'film', label: 'Film Stock (胶片质感)', type: 'select', options: [
                        'Digital Clean (数码洁净)', 'Kodak Portra 400 (人像胶片)', 'Fujifilm Velvia (高饱和)', 
                        'Ilford HP5 (黑白胶片)', 'Kodak Gold 200 (暖色怀旧)', 'Polaroid (拍立得)', 'VHS Tape (录像带噪点)'
                    ]}
                ]
            },
            library: {
                title: "Prompt Vault (经典词库)",
                models: ['Universal Format'],
                inputs: [
                    { id: 'template', label: 'Select Template (选择高频模版)', type: 'select', options: Object.keys(libraryTemplates) }
                ]
            },
            tiktok: {
                title: "TikTok Director (抖音脚本)",
                models: ['GPT-4o', 'Claude 3 Opus'],
                inputs: [
                    { id: 'topic', label: 'Video Topic (视频主题)', type: 'text', placeholder: 'e.g. 沉浸式开箱 iPhone 15' },
                    { id: 'hook', label: 'Opening Hook (开头黄金3秒)', type: 'select', options: [
                        'Visual Shock (视觉奇观/特效)', 'Contrast/Reversal (巨大反差/反转)', 
                        'Pain Point Question (痛点提问)', 'Controversial Statement (暴论/争议)',
                        'ASMR Sound (沉浸式音效)', 'Direct Benefit (利益点直给)', 'Storytime (故事引入)'
                    ]},
                    { id: 'niche', label: 'Niche (赛道/垂类)', type: 'select', options: [
                        'Beauty/Skincare (美妆护肤)', 'Tech/Gadgets (数码科技)', 'Food/Cooking (美食烹饪)', 
                        'Travel/Vlog (旅行生活)', 'Education/Tips (知识干货)', 'Comedy/Skit (剧情搞笑)', 
                        'Fitness/Health (运动健康)', 'Pet/Animals (萌宠)'
                    ]},
                    { id: 'pace', label: 'Editing Pace (剪辑节奏)', type: 'select', options: [
                        'Fast & Punchy (快节奏/卡点)', 'Slow & Cinematic (慢节奏/电影感)', 
                        'Sync to Beat (踩点剪辑)', 'Vlog Style (生活流/自然)'
                    ]},
                    { id: 'bgm', label: 'BGM Mood (音乐情绪)', type: 'select', options: [
                        'Trending/Viral (热门榜单)', 'Upbeat/Fun (欢快搞怪)', 'Suspense/Dark (悬疑/吃瓜)',
                        'Lo-fi/Chill (治愈/放松)', 'Epic/Dramatic (史诗/反转)', 'Phonk/Drift (运动/燃)'
                    ]},
                    { id: 'cta', label: 'CTA (互动引导)', type: 'select', options: [
                        'Follow for More (关注看下集)', 'Comment Below (评论区互动)', 
                        'Check Link in Bio (主页链接)', 'Save this Video (收藏防走丢)'
                    ]}
                ]
            },
            academic: {
                title: "Academic Scholar (学术科研)",
                models: ['Claude 3.5 Sonnet', 'GPT-4o (Academic)'],
                inputs: [
                    { id: 'content', label: 'Abstract/Paragraph (段落/摘要)', type: 'textarea', placeholder: '在此粘贴需要润色或降重的文本...', height: '150px' },
                    { id: 'field', label: 'Research Field (研究领域)', type: 'select', options: [
                        'Computer Science (计算机科学)', 'Artificial Intelligence (人工智能)', 'Medicine/Clinical (临床医学)', 
                        'Biology/Life Sciences (生物科学)', 'Business/Management (商科/管理)', 'Economics (经济学)',
                        'Engineering (工程学)', 'Psychology (心理学)', 'Sociology (社会学)', 'Education (教育学)',
                        'Physics/Astronomy (物理/天文)', 'Chemistry (化学)', 'Law/Legal (法学)', 'History/Arts (历史/艺术)'
                    ]},
                    { id: 'target', label: 'Target Style (投稿目标)', type: 'select', options: [
                        'IEEE Standard (IEEE标准)', 'Nature/Science (顶级期刊风格)', 'APA Format (APA格式)', 
                        'MLA Style (MLA格式)', 'Chicago Style (芝加哥格式)', 'Harvard Style (哈佛格式)',
                        'General Academic (通用学术)', 'Thesis/Dissertation (学位论文)'
                    ]},
                    { id: 'goal', label: 'Optimization Goal (优化目标)', type: 'select', options: [
                        'Polish Grammar (深度润色)', 'Reduce Repetition (降重/去AI味)', 'Enhance Logic (逻辑增强)', 
                        'Make Concise (精简语句)', 'Fix Chinglish (中式英语矫正)', 'Translate to English (中译英)'
                    ]}
                ]
            },
            video: {
                title: "Video Director (视频)",
                models: ['Runway Gen-2', 'Pika Labs', 'Sora', 'Stable Video'],
                inputs: [
                    { id: 'subject', label: 'Subject (视频内容)', type: 'text', placeholder: 'e.g. 海浪拍打礁石' },
                    { id: 'camera', label: 'Camera Movement (运镜方式)', type: 'select', options: [
                        'Pan Right (右摇)', 'Pan Left (左摇)', 'Tilt Up (上摇)', 'Tilt Down (下摇)',
                        'Zoom In (推镜头)', 'Zoom Out (拉镜头)', 'Orbit/Arc (环绕)', 'FPV Drone (穿越机)', 
                        'Truck Left/Right (左右平移)', 'Dolly In/Out (轨道推拉)', 'Handheld (手持感)'
                    ]},
                    { id: 'motion', label: 'Motion Intensity (动态幅度)', type: 'select', options: ['Low (低动态)', 'Medium (中动态)', 'High (高动态)', 'Speed Ramp (变速)'] },
                    { id: 'style', label: 'Visual Style (视觉风格)', type: 'select', options: ['Cinematic (电影感)', '3D Animation (3D动画)', 'Anime (二次元)', 'Vintage VHS (复古录像带)', 'Documentary (纪录片)'] }
                ]
            },
            audio: {
                title: "Music Producer (音乐)",
                models: ['Suno V3', 'Udio'],
                inputs: [
                    { id: 'genre', label: 'Genre (流派)', type: 'select', options: [
                        'Pop (流行)', 'K-pop (韩流)', 'Rock (摇滚)', 'Jazz (爵士)', 'Hip Hop (嘻哈)', 
                        'EDM (电子舞曲)', 'House (浩室)', 'Techno (科技舞曲)', 'Dubstep (回响贝斯)',
                        'R&B (节奏蓝调)', 'Country (乡村)', 'Reggae (雷鬼)', 'Classical (古典)',
                        'Epic Orchestral (史诗管弦)', 'Lo-fi (低保真)', 'Phonk (冯克)', 'Synthwave (合成器波)'
                    ]},
                    { id: 'mood', label: 'Mood (情绪)', type: 'select', options: ['Happy (快乐)', 'Sad (悲伤)', 'Energetic (活力)', 'Chill (放松)', 'Dark (黑暗)', 'Romantic (浪漫)', 'Ethereal (空灵)', 'Aggressive (激昂)'] },
                    { id: 'vocal', label: 'Vocals (人声)', type: 'select', options: ['Female (女声)', 'Male (男声)', 'Duet (对唱)', 'Instrumental (纯音乐)', 'Choir (合唱)', 'Whisper (耳语)', 'Autotune (电音)'] }
                ]
            },
            email: {
                title: "Global Sales (外贸开发)",
                models: ['GPT-4o (Sales)', 'Claude 3 Haiku'],
                inputs: [
                    { id: 'product', label: 'Product (推销产品)', type: 'text', placeholder: 'e.g. Solar Panels' },
                    { id: 'role', label: 'Recipient (收件人)', type: 'select', options: [
                        'CEO / Owner (老板)', 'Purchasing Manager (采购经理)', 'Product Manager (产品经理)', 
                        'Marketing Director (营销总监)', 'CTO (技术总监)', 'General Inquiry (一般咨询)'
                    ]},
                    { id: 'stage', label: 'Stage (营销阶段)', type: 'select', options: [
                        'Cold Outreach (首次开发)', 'Follow Up 1 (跟进 1)', 'Follow Up 2 (跟进 2)', 
                        'Proposal (报价/提案)', 'Re-engagement (激活僵尸粉)', 'Break-up Email (最后尝试)'
                    ]},
                    { id: 'framework', label: 'Framework (营销框架)', type: 'select', options: [
                        'AIDA (注意-兴趣-欲望-行动)', 'BAB (前-后-桥梁)', 'PAS (问题-加剧-解决)', 
                        'Direct Pitch (开门见山)', 'Storytelling (讲故事)', 'Value Proposition (价值主张)'
                    ]},
                    { id: 'lang', label: 'Language (目标语言)', type: 'select', options: [
                        'English US (美式英语)', 'English UK (英式英语)', 'Spanish (西班牙语)', 'French (法语)', 
                        'German (德语)', 'Japanese (日语)', 'Arabic (阿拉伯语)', 'Chinese (中文)', 'Russian (俄语)'
                    ]}
                ]
            },
            xhs: { 
                title: "小红书矩阵", 
                models:['Claude 3'], 
                inputs: [
                    {id:'topic',label:'Topic (选题)',type:'text'}, 
                    {id:'niche',label:'Niche (赛道)',type:'select',options:['Beauty (美妆)', 'Tech (数码)', 'Fashion (穿搭)', 'Food (美食)', 'Knowledge (知识付费)']}
                ]
            },
            text: { 
                title: "Copywriter (写作)", 
                models:['GPT-4'], 
                inputs: [
                    {id:'topic',label:'Topic (主题)',type:'text'}, 
                    {id:'framework',label:'Framework (框架)',type:'select',options:['AIDA (注意-兴趣)', 'PAS (问题-解决)', 'First Principles (第一性原理)']}
                ]
            },
            reverse: {
                title: "Reverse Engineering (逆向工程)",
                models: ['GPT-4 Vision', 'Claude 3 Opus'],
                inputs: [
                    { id: 'desc', label: 'Description (补充描述)', type: 'textarea', placeholder: 'e.g. 模仿这个灯光...', height: '80px' },
                    { id: 'mode', label: 'Mode (分析模式)', type: 'select', options: [
                        'Extract Visual Prompts (提取视觉提示词)', 'Analyze Layout (分析构图)', 'Extract Color (提取配色)'
                    ]}
                ]
            }
        };

        let currentTool = 'visual';

        window.onload = () => {
            loadTool('visual');
        };

        function loadTool(key) {
            currentTool = key;
            const data = tools[key];
            
            document.getElementById('toolTitle').innerText = data.title;
            document.getElementById('targetModel').innerHTML = data.models.map(m => `<option>${m}</option>`).join('');

            // UI 状态切换
            const uploadArea = document.getElementById('uploadArea');
            const abTestGroup = document.getElementById('abTestGroup');
            const actionBtn = document.getElementById('actionBtn');

            // 逆向工程显示上传
            if (key === 'reverse') {
                uploadArea.style.display = 'block';
                abTestGroup.style.display = 'none'; 
                actionBtn.innerHTML = '<i class="fas fa-search"></i> 开始分析';
                actionBtn.classList.remove('purple');
            } else if (key === 'library') {
                uploadArea.style.display = 'none';
                abTestGroup.style.display = 'none'; 
                actionBtn.innerHTML = '<i class="fas fa-copy"></i> 获取模版';
                actionBtn.classList.add('purple');
            } else {
                uploadArea.style.display = 'none';
                abTestGroup.style.display = 'flex';
                actionBtn.innerHTML = '<i class="fas fa-bolt"></i> 立即生成';
                actionBtn.classList.remove('purple');
            }

            // 渲染表单
            const container = document.getElementById('dynamicForm');
            container.innerHTML = '';
            
            data.inputs.forEach(field => {
                const div = document.createElement('div');
                div.className = 'input-group';
                
                let inputHtml = '';
                if(field.type === 'select') {
                    const opts = field.options.map(o => `<option>${o}</option>`).join('');
                    inputHtml = `<select id="f_${field.id}">${opts}</select>`;
                } else if (field.type === 'textarea') {
                    inputHtml = `<textarea id="f_${field.id}" placeholder="${field.placeholder || ''}" style="height:${field.height || '100px'}"></textarea>`;
                } else {
                    inputHtml = `<input type="text" id="f_${field.id}" placeholder="${field.placeholder || ''}">`;
                }

                let magicBtn = '';
                if(field.magic) {
                    magicBtn = `<button class="magic-btn" onclick="magicExpand('f_${field.id}')" title="AI扩写"><i class="fas fa-magic"></i></button>`;
                }

                div.innerHTML = `<label>${field.label}</label>${inputHtml}${magicBtn}`;
                container.appendChild(div);
            });

            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            const items = document.querySelectorAll('.menu-item');
            items.forEach(item => {
                if(item.getAttribute('onclick').includes(key)) item.classList.add('active');
            });
            
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                const display = document.getElementById('fileNameDisplay');
                display.style.display = 'block';
                display.innerText = `✅ 文件已就绪: ${file.name} (${(file.size/1024/1024).toFixed(2)}MB)`;
            }
        }

        function generate() {
            const model = document.getElementById('targetModel').value;
            const isAB = document.getElementById('abTest').checked;
            const toolData = tools[currentTool];
            const fileInput = document.getElementById('fileInput');
            
            const inputs = {};
            toolData.inputs.forEach(f => {
                const el = document.getElementById(`f_${f.id}`);
                inputs[f.id] = el ? el.value : '';
            });

            if (currentTool === 'reverse' && fileInput.files.length > 0) {
                simulateVisionAnalysis(fileInput.files[0].name, model, inputs);
                return;
            }

            // 词库直接获取逻辑
            if (currentTool === 'library') {
                const selectedKey = inputs.template;
                const templateContent = libraryTemplates[selectedKey] || "Prompt not found.";
                const container = document.getElementById('resultContainer');
                container.innerHTML = `<div class="result-box"><div class="ab-tag">Template Loaded</div>${templateContent} <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i></div>`;
                return;
            }

            const container = document.getElementById('resultContainer');
            container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;"><i class="fas fa-spinner fa-spin"></i> Generating...</div>';

            setTimeout(() => {
                container.innerHTML = ''; 
                const versions = isAB ? ['Version A', 'Version B', 'Version C'] : ['Result'];
                
                versions.forEach(ver => {
                    const prompt = buildPrompt(currentTool, model, inputs, ver);
                    const box = document.createElement('div');
                    box.className = 'result-box';
                    box.innerHTML = `<div class="ab-tag">${ver}</div>${prompt} <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                    container.appendChild(box);
                });
            }, 800);
        }

        function simulateVisionAnalysis(filename, model, inputs) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            const steps = [`🔍 Reading ${filename}...`, `🧠 Extracting semantics...`, `✨ Generating prompt...`];
            let stepIndex = 0;
            const box = document.createElement('div');
            box.className = 'result-box';
            box.style.color = 'var(--text-sub)';
            container.appendChild(box);

            const interval = setInterval(() => {
                if (stepIndex >= steps.length) {
                    clearInterval(interval);
                    box.style.color = '#10b981';
                    box.innerHTML = `<div class="ab-tag">Analysis Result</div>/imagine prompt: highly detailed shot of ${filename} content...`;
                    box.innerHTML += ` <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                } else {
                    box.innerText = steps[stepIndex];
                    stepIndex++;
                }
            }, 600);
        }

        function buildPrompt(toolKey, model, inputs, ver) {
            // 清理中文备注
            const cleanInputs = {};
            for (const key in inputs) {
                const val = inputs[key];
                if (val && val.includes('(')) cleanInputs[key] = val.split('(')[0].trim();
                else cleanInputs[key] = val;
            }

            let res = "";
            if (toolKey === 'email') {
                res = `Subject: [Hook for ${cleanInputs.product}]\n\nHi [Name],\n\n(Context: Sales to ${cleanInputs.role})\n[Body using ${cleanInputs.framework}...]\n\n[CTA: ${cleanInputs.cta}]`;
            } else if (toolKey === 'tiktok') {
                res = `Title: [${cleanInputs.topic}]\nTarget: TikTok\nLength: ${cleanInputs.duration}\n\n[Hook (${cleanInputs.hook})]: (0-3s script)\n[Content]: (Main script, Pace: ${cleanInputs.pace})\n[BGM]: (${cleanInputs.bgm})\n[CTA]: ${cleanInputs.cta}`;
            } else if (toolKey === 'academic') {
                res = `[Field: ${cleanInputs.field}]\n[Target: ${cleanInputs.target}]\n[Goal: ${cleanInputs.goal}]\n\nRevised Text:\n(AI Polished version of input...)`;
            } else if (toolKey === 'visual') {
                res = `/imagine prompt: ${Object.values(cleanInputs).join(', ')} --v 6.0`;
            } else if (toolKey === 'audio') {
                res = `[Genre: ${cleanInputs.genre}] [Instruments: ${cleanInputs.genre}] [Mood: ${cleanInputs.mood}] [Vocals: ${cleanInputs.vocal}]`;
            } else {
                res = `### Task: ${tools[toolKey].title}\n### Inputs: ${JSON.stringify(cleanInputs)}\n### Model: ${model}`;
            }
            return res;
        }

        function copyText(icon) {
            navigator.clipboard.writeText(icon.parentElement.innerText.replace("Copy", "").trim());
            alert("Copied!");
        }

        function magicExpand(id) {
            document.getElementById(id).value += " (AI Optimized)";
        }
    </script>
</body>
</html>
