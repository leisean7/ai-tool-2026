<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CommandOS V23 | 核心增强版</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --sidebar: #151921;
            --panel: #222630;
            --input: #2f3442;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #e2e8f0;
            --text-sub: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
            --purple: #8b5cf6;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        /* --- 布局结构 --- */
        .app-container { display: flex; width: 100%; height: 100%; }
        
        /* 1. 左侧导航 */
        .sidebar {
            width: 250px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
            overflow-y: auto;
        }

        .brand {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent); }

        .menu-category { padding: 20px 20px 8px; font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        
        .menu-item {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-sub);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: rgba(59, 130, 246, 0.15); color: var(--accent); border-left-color: var(--accent); }
        .menu-item i { width: 18px; text-align: center; }

        /* 2. 中间工作区 */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
            position: relative;
        }

        .topbar {
            height: 55px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg);
        }

        .model-selector select {
            background: var(--panel); color: white; border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
        }

        .scroll-area {
            flex: 1; overflow-y: auto; padding: 20px; max-width: 1000px; margin: 0 auto; width: 100%;
        }

        /* 3. 右侧上下文面板 (Brand DNA) - 增强版 */
        .context-panel {
            width: 300px; /* 稍微加宽一点 */
            background: var(--sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 20px;
            overflow-y: auto;
        }

        /* --- 基础组件 --- */
        .card-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 15px; color: var(--text-sub); display: flex; justify-content: space-between; text-transform: uppercase; align-items: center;}
        
        .reset-btn { font-size: 0.7rem; color: var(--accent); cursor: pointer; text-transform: none; }
        .reset-btn:hover { text-decoration: underline; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group { position: relative; }
        
        label { display: block; margin-bottom: 6px; color: var(--text-sub); font-size: 0.8rem; }
        input, select, textarea {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; font-family: inherit; margin-bottom: 0;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #3b4050; }

        .magic-btn {
            position: absolute; right: 8px; top: 28px;
            background: transparent; border: none; color: var(--gold);
            cursor: pointer; font-size: 0.9rem; padding: 4px;
        }
        .magic-btn:hover { transform: scale(1.1); }

        .action-bar { display: flex; gap: 15px; align-items: center; margin-top: 10px; padding-bottom: 30px; }
        .btn-main {
            flex: 1; padding: 12px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }
        .btn-main:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-main.purple { background: var(--purple); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2); }
        .btn-main.purple:hover { background: #7c3aed; }
        
        .switch-group { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 0.85rem; cursor: pointer; user-select: none; }
        .switch-group input { margin: 0; accent-color: var(--accent); }

        /* 结果展示 */
        .result-container { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .result-box {
            background: #000; border: 1px solid var(--border); border-radius: 8px;
            padding: 15px; font-family: 'Monaco', monospace; color: #10b981;
            font-size: 0.85rem; line-height: 1.5; min-height: 80px; white-space: pre-wrap; position: relative;
        }
        .ab-tag {
            position: absolute; top: 0; left: 0; background: var(--panel); 
            padding: 2px 8px; font-size: 0.7rem; border-bottom-right-radius: 6px; color: var(--text-sub); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
        }

        /* 上传区域 */
        .upload-zone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 25px;
            text-align: center; color: var(--text-sub); cursor: pointer;
            transition: 0.2s; background: rgba(0,0,0,0.2);
            margin-bottom: 20px; display: none;
        }
        .upload-zone:hover { border-color: var(--accent); color: var(--accent); background: rgba(59, 130, 246, 0.05); }
        .file-name { margin-top: 10px; font-size: 0.85rem; color: var(--gold); display: none; font-weight: bold;}

        /* 分隔线 */
        .hr-line { border-top: 1px solid var(--border); margin: 20px 0; }

        @media (max-width: 1024px) { .context-panel { display: none; } }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; height: 100%; transition: 0.3s; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .mobile-toggle { display: block; }
            .topbar { padding: 0 15px; }
            .scroll-area { padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="sidebar" id="sidebar">
            <div class="brand"><i class="fas fa-terminal"></i> Command<span>OS</span></div>
            
            <div class="menu-category">Generative Studio</div>
            <div class="menu-item active" onclick="loadTool('visual')"><i class="fas fa-camera"></i> 视觉 (Visual)</div>
            <div class="menu-item" onclick="loadTool('video')"><i class="fas fa-video"></i> 视频 (Video)</div>
            <div class="menu-item" onclick="loadTool('audio')"><i class="fas fa-music"></i> 音乐 (Audio)</div>
            <div class="menu-item" onclick="loadTool('text')"><i class="fas fa-pen-nib"></i> 写作 (Copy)</div>
            
            <div class="menu-category">Professional Matrix</div>
            <div class="menu-item" onclick="loadTool('email')"><i class="fas fa-envelope-open-text"></i> 外贸开发 (Sales)</div>
            <div class="menu-item" onclick="loadTool('academic')"><i class="fas fa-graduation-cap"></i> 学术科研 (Scholar)</div>
            <div class="menu-item" onclick="loadTool('xhs')"><i class="fab fa-instagram"></i> 小红书矩阵</div>
            <div class="menu-item" onclick="loadTool('tiktok')"><i class="fab fa-tiktok"></i> 抖音/TikTok</div>
            
            <div class="menu-category">AI Resources</div>
            <div class="menu-item" onclick="loadTool('reverse')"><i class="fas fa-upload"></i> 逆向工程 (Reverse)</div>
            <div class="menu-item" onclick="loadTool('library')"><i class="fas fa-book"></i> 经典词库 (Library)</div>
        </div>

        <div class="workspace">
            <div class="topbar">
                <div style="display:flex; gap:15px; align-items:center;">
                    <i class="fas fa-bars mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"></i>
                    <span style="font-weight:bold; font-size:1.1rem;" id="toolTitle">视觉指令台</span>
                </div>
                <div class="model-selector">
                    <select id="targetModel">
                        </select>
                </div>
            </div>

            <div class="scroll-area">
                
                <div id="uploadArea" class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-cloud-upload-alt" style="font-size:2rem; margin-bottom:10px;"></i>
                    <div>点击或拖拽上传图片</div>
                    <div id="fileNameDisplay" class="file-name"></div>
                    <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
                </div>

                <div id="dynamicForm" class="form-grid"></div>

                <div class="action-bar">
                    <div class="switch-group" id="abTestGroup">
                        <input type="checkbox" id="abTest"> <span>A/B 测试 (3版)</span>
                    </div>
                    <button class="btn-main" id="actionBtn" onclick="generate()">
                        <i class="fas fa-bolt"></i> 立即生成
                    </button>
                </div>

                <div class="card-title">
                    <span>Output Terminal</span>
                    <span style="font-size:0.75rem; cursor:pointer; color:var(--accent);" onclick="document.getElementById('resultContainer').innerHTML=''">Clear</span>
                </div>
                <div id="resultContainer" class="result-container"></div>
            </div>
        </div>

        <div class="context-panel">
            <div class="card-title">
                <span>🧬 品牌 DNA (Memory)</span>
                <span class="reset-btn" onclick="resetDNA()">Reset</span>
            </div>
            <p style="font-size:0.8rem; color:var(--text-sub); margin-bottom:15px;">全局设定，自动注入。</p>
            
            <label>Identity Name (品牌/产品名)</label>
            <input type="text" id="dnaName" placeholder="e.g. Nexus AI / Tesla Model Y">

            <label>Output Language (输出语言)</label>
            <select id="dnaLang">
                <option value="">-- Auto (自动) --</option>
                <option value="English">English (英语)</option>
                <option value="Chinese">Chinese (简体中文)</option>
                <option value="Japanese">Japanese (日语)</option>
                <option value="Spanish">Spanish (西班牙语)</option>
                <option value="German">German (德语)</option>
            </select>
            
            <label>Role Persona (角色设定)</label>
            <select id="dnaRole">
                <option value="">-- Default (默认) --</option>
                <option value="Senior Expert">Senior Expert (资深专家)</option>
                <option value="Friendly Assistant">Friendly Assistant (贴心助手)</option>
                <option value="Strict Critic">Strict Critic (严厉批评家)</option>
                <option value="Creative Writer">Creative Writer (创意作家)</option>
            </select>

            <div class="hr-line"></div>

            <label>Brand Color (品牌主色)</label>
            <input type="text" id="dnaColor" placeholder="e.g. #FF5733, Tech Blue">

            <label>Target Audience (目标受众)</label>
            <input type="text" id="dnaTarget" placeholder="e.g. Gen Z, 程序员, 宝妈">

            <label>Tone of Voice (语气基调)</label>
            <select id="dnaTone">
                <option value="">-- Default --</option>
                <option value="Professional">Professional (专业严谨)</option>
                <option value="Urgent">Urgent (紧迫感)</option>
                <option value="Friendly">Friendly (亲和友好)</option>
                <option value="Luxurious">Luxurious (高端奢华)</option>
                <option value="Humorous">Humorous (幽默风趣)</option>
            </select>

            <label>Negative Prompt (负向/禁用词)</label>
            <textarea id="dnaNegative" placeholder="e.g. text, watermark, bad quality..." style="height:60px;"></textarea>
        </div>

    </div>

    <script>
        // === 级联词库数据 (Database) ===
        const libraryDB = {
            "Visual": {
                label: "🎨 Visual Art (视觉/绘画)",
                scenarios: [
                    "Portrait Photography (人像摄影)", "Logo Design (标志设计)", "UI/UX Interface (界面设计)",
                    "Cyberpunk City (赛博朋克)", "Product Shot (产品摄影)", "Anime Character (二次元角色)",
                    "Interior Design (室内设计)", "Game Asset (游戏素材)"
                ]
            },
            "Writing": {
                label: "✍️ Writing & Copy (写作/文案)",
                scenarios: [
                    "SEO Blog Post (SEO博客)", "Instagram Caption (INS文案)", "Twitter Thread (推特串推)",
                    "Youtube Script (油管脚本)", "Press Release (新闻稿)", "Storytelling (故事创作)",
                    "Translation (专业翻译)", "Resume Polish (简历润色)"
                ]
            },
            "Coding": {
                label: "💻 Coding & Dev (编程/开发)",
                scenarios: [
                    "Python Debugging (Python除错)", "SQL Query Generator (SQL生成)", "Regex Helper (正则助手)",
                    "Code Refactoring (代码重构)", "React Component (React组件)", "Explain Code (解释代码)"
                ]
            },
            "Office": {
                label: "💼 Office & Productivity (办公/效率)",
                scenarios: [
                    "Excel Formula (Excel公式)", "Email Reply (邮件回复)", "Meeting Summary (会议纪要)",
                    "PPT Outline (PPT大纲)", "SWOT Analysis (SWOT分析)", "Mind Map Structure (思维导图)"
                ]
            }
        };

        // === 工具配置 ===
        const tools = {
            visual: {
                title: "Visual Director (视觉)",
                models: ['Midjourney V6', 'Niji V6', 'Stable Diffusion XL', 'DALL-E 3'],
                inputs: [
                    { id: 'subject', label: 'Subject (画面主体)', type: 'text', placeholder: 'e.g. 赛博朋克风格的猫', magic: true },
                    { id: 'style', label: 'Style (艺术风格)', type: 'select', options: [
                        'Photorealistic (真实摄影)', 'Cyberpunk (赛博朋克)', 'Anime (日系动漫)', '3D Render (3D渲染)', 
                        'UE5 (虚幻引擎5)', 'Oil Painting (油画)', 'Watercolor (水彩)', 'Pixel Art (像素艺术)', 
                        'Bauhaus (包豪斯)', 'Minimalist Vector (极简矢量)'
                    ]},
                    { id: 'shot', label: 'Shot (构图/运镜)', type: 'select', options: [
                        'Wide Angle (广角)', 'Telephoto (长焦)', 'Drone View (无人机视角)', 'Macro (微距)', 
                        'Isometric (等轴测)', 'Selfie (自拍)', 'Fisheye (鱼眼)', 'Over-the-Shoulder (过肩镜头)'
                    ]},
                    { id: 'light', label: 'Lighting (布光)', type: 'select', options: [
                        'Cinematic (电影光)', 'Natural (自然光)', 'Neon (霓虹光)', 'Rembrandt (伦勃朗光)', 
                        'Volumetric (体积光/丁达尔)', 'Golden Hour (黄金时刻)', 'Studio Lighting (影棚光)'
                    ]}
                ]
            },
            library: {
                title: "Prompt Vault (经典词库)",
                models: ['Universal Format'],
                inputs: [
                    { id: 'category', label: 'Category (核心分类)', type: 'select', options: Object.keys(libraryDB) },
                    { id: 'scenario', label: 'Scenario (应用场景)', type: 'select', options: [] }, 
                    { id: 'level', label: 'Level (指令复杂度)', type: 'select', options: ['Standard (标准版)', 'Expert (专家版/思维链)'] }
                ]
            },
            video: {
                title: "Video Director (视频)",
                models: ['Runway Gen-2', 'Pika Labs', 'Sora', 'Stable Video'],
                inputs: [
                    { id: 'subject', label: 'Subject (视频内容)', type: 'text', placeholder: 'e.g. 海浪拍打礁石' },
                    { id: 'camera', label: 'Camera (运镜方式)', type: 'select', options: [
                        'Pan Right (右摇)', 'Pan Left (左摇)', 'Zoom In (推镜头)', 'Zoom Out (拉镜头)', 
                        'Orbit (环绕)', 'FPV (第一人称)', 'Truck (平移)'
                    ]},
                    { id: 'motion', label: 'Motion (动态幅度)', type: 'select', options: ['Low (低动态)', 'Medium (中动态)', 'High (高动态)', 'Speed Ramp (变速)'] },
                    { id: 'fps', label: 'FPS (帧率)', type: 'select', options: ['24fps (Cinematic)', '30fps (Standard)', '60fps (Smooth)'] }
                ]
            },
            audio: {
                title: "Music Producer (音乐)",
                models: ['Suno V3', 'Udio'],
                inputs: [
                    { id: 'genre', label: 'Genre (流派)', type: 'select', options: [
                        'Pop (流行)', 'K-pop (韩流)', 'Rock (摇滚)', 'Jazz (爵士)', 'Hip Hop (嘻哈)', 
                        'EDM (电子舞曲)', 'Epic Orchestral (史诗管弦)', 'Lo-fi (低保真)'
                    ]},
                    { id: 'mood', label: 'Mood (情绪)', type: 'select', options: ['Happy (快乐)', 'Sad (悲伤)', 'Energetic (活力)', 'Chill (放松)', 'Dark (黑暗)'] },
                    { id: 'vocal', label: 'Vocals (人声)', type: 'select', options: ['Female (女声)', 'Male (男声)', 'Duet (对唱)', 'Instrumental (纯音乐)', 'Choir (合唱)'] }
                ]
            },
            email: {
                title: "Global Sales (外贸开发)",
                models: ['GPT-4o (Sales)', 'Claude 3 Haiku'],
                inputs: [
                    { id: 'product', label: 'Product (推销产品)', type: 'text', placeholder: 'e.g. Solar Panels' },
                    { id: 'role', label: 'Recipient (收件人)', type: 'select', options: [
                        'CEO / Owner (老板)', 'Purchasing Manager (采购经理)', 'Product Manager (产品经理)', 
                        'General Inquiry (一般咨询)'
                    ]},
                    { id: 'stage', label: 'Stage (营销阶段)', type: 'select', options: [
                        'Cold Outreach (首次开发)', 'Follow Up 1 (跟进 1)', 'Proposal (报价/提案)', 'Re-engagement (激活)'
                    ]},
                    { id: 'framework', label: 'Framework (营销框架)', type: 'select', options: [
                        'AIDA (注意-兴趣-欲望-行动)', 'BAB (前-后-桥梁)', 'PAS (问题-加剧-解决)', 'Direct Pitch (直球推销)'
                    ]},
                    { id: 'cta', label: 'CTA (行动号召)', type: 'select', options: [
                        'Book a Call (预约会议)', 'Reply for Info (回复获取信息)', 'Request Sample (索取样品)', 'Visit Website (访问网站)'
                    ]},
                    { id: 'lang', label: 'Language (目标语言)', type: 'select', options: [
                        'English US (美式英语)', 'English UK (英式英语)', 'Spanish (西班牙语)', 'French (法语)', 
                        'German (德语)', 'Japanese (日语)', 'Arabic (阿拉伯语)', 'Chinese (中文)'
                    ]}
                ]
            },
            academic: {
                title: "Academic Scholar (学术科研)",
                models: ['Claude 3.5 Sonnet', 'GPT-4o (Academic)'],
                inputs: [
                    { id: 'content', label: 'Content (段落/摘要)', type: 'textarea', placeholder: '在此粘贴需要润色或降重的文本...', height: '120px' },
                    { id: 'field', label: 'Field (研究领域)', type: 'text', placeholder: 'e.g. Neuroscience' },
                    { id: 'target', label: 'Style (投稿风格)', type: 'select', options: [
                        'IEEE Standard (IEEE标准)', 'Nature/Science Style (Nature风格)', 'APA Format (APA格式)', 
                        'General Academic (通用学术)'
                    ]},
                    { id: 'goal', label: 'Goal (优化目标)', type: 'select', options: [
                        'Reduce Repetition (降重)', 'Polish Grammar (润色语法)', 'Enhance Logic (增强逻辑)', 
                        'Fix Chinglish (中式英语矫正)'
                    ]}
                ]
            },
            reverse: {
                title: "Reverse Engineering (逆向工程)",
                models: ['GPT-4 Vision', 'Claude 3 Opus'],
                inputs: [
                    { id: 'desc', label: 'Description (补充描述)', type: 'textarea', placeholder: 'e.g. 模仿这个灯光...', height: '80px' },
                    { id: 'mode', label: 'Mode (分析模式)', type: 'select', options: [
                        'Extract Visual Prompts (提取视觉提示词)', 'Analyze Layout (分析构图)', 'Extract Color (提取配色)'
                    ]}
                ]
            },
            text: { 
                title: "Copywriter (写作)", 
                models:['GPT-4'], 
                inputs: [
                    {id:'topic',label:'Topic (主题)',type:'text'}, 
                    {id:'framework',label:'Framework (框架)',type:'select',options:['AIDA (注意-兴趣)', 'PAS (问题-解决)', 'First Principles (第一性原理)']}
                ]
            },
            xhs: { 
                title: "小红书矩阵", 
                models:['Claude 3'], 
                inputs: [
                    {id:'topic',label:'Topic (选题)',type:'text'}, 
                    {id:'niche',label:'Niche (赛道)',type:'select',options:['Beauty (美妆)', 'Tech (数码)', 'Fashion (穿搭)', 'Food (美食)', 'Knowledge (知识付费)']}
                ]
            },
            tiktok: { 
                title: "抖音脚本", 
                models:['GPT-4'], 
                inputs: [
                    {id:'topic',label:'Topic (主题)',type:'text'}, 
                    {id:'hook',label:'Hook (开头)',type:'select',options:['Visual Shock (视觉奇观)', 'Contrast (反差)', 'Question (提问)']}
                ]
            }
        };

        let currentTool = 'visual';

        window.onload = () => {
            loadTool('visual');
        };

        function loadTool(key) {
            currentTool = key;
            const data = tools[key];
            
            document.getElementById('toolTitle').innerText = data.title;
            document.getElementById('targetModel').innerHTML = data.models.map(m => `<option>${m}</option>`).join('');

            // UI 状态切换
            const uploadArea = document.getElementById('uploadArea');
            const abTestGroup = document.getElementById('abTestGroup');
            const actionBtn = document.getElementById('actionBtn');

            if (key === 'reverse') {
                uploadArea.style.display = 'block';
                abTestGroup.style.display = 'none'; 
                actionBtn.innerHTML = '<i class="fas fa-search"></i> 开始分析';
                actionBtn.classList.remove('purple');
            } else if (key === 'library') {
                uploadArea.style.display = 'none';
                abTestGroup.style.display = 'none'; 
                actionBtn.innerHTML = '<i class="fas fa-book-open"></i> 调取词库';
                actionBtn.classList.add('purple');
            } else {
                uploadArea.style.display = 'none';
                abTestGroup.style.display = 'flex';
                actionBtn.innerHTML = '<i class="fas fa-bolt"></i> 立即生成';
                actionBtn.classList.remove('purple');
            }

            // 渲染表单
            const container = document.getElementById('dynamicForm');
            container.innerHTML = '';
            
            data.inputs.forEach(field => {
                const div = document.createElement('div');
                div.className = 'input-group';
                
                let inputHtml = '';
                if(field.type === 'select') {
                    if (key === 'library' && field.id === 'category') {
                         const opts = field.options.map(k => `<option value="${k}">${libraryDB[k].label}</option>`).join('');
                         inputHtml = `<select id="f_${field.id}" onchange="updateScenario(this.value)">${opts}</select>`;
                    } else {
                        const opts = field.options.map(o => `<option>${o}</option>`).join('');
                        inputHtml = `<select id="f_${field.id}">${opts}</select>`;
                    }
                } else if (field.type === 'textarea') {
                    inputHtml = `<textarea id="f_${field.id}" placeholder="${field.placeholder || ''}" style="height:${field.height || '100px'}"></textarea>`;
                } else {
                    inputHtml = `<input type="text" id="f_${field.id}" placeholder="${field.placeholder || ''}">`;
                }

                let magicBtn = '';
                if(field.magic) {
                    magicBtn = `<button class="magic-btn" onclick="magicExpand('f_${field.id}')" title="AI扩写"><i class="fas fa-magic"></i></button>`;
                }

                div.innerHTML = `<label>${field.label}</label>${inputHtml}${magicBtn}`;
                container.appendChild(div);
            });

            if (key === 'library') {
                updateScenario(Object.keys(libraryDB)[0]);
            }

            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            const items = document.querySelectorAll('.menu-item');
            items.forEach(item => {
                if(item.getAttribute('onclick').includes(key)) item.classList.add('active');
            });
            
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function updateScenario(category) {
            const scenarioSelect = document.getElementById('f_scenario');
            if (scenarioSelect && libraryDB[category]) {
                const scenarios = libraryDB[category].scenarios;
                scenarioSelect.innerHTML = scenarios.map(s => `<option>${s}</option>`).join('');
            }
        }

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                const display = document.getElementById('fileNameDisplay');
                display.style.display = 'block';
                display.innerText = `✅ 文件已就绪: ${file.name} (${(file.size/1024/1024).toFixed(2)}MB)`;
            }
        }

        function generate() {
            const model = document.getElementById('targetModel').value;
            const isAB = document.getElementById('abTest').checked;
            const toolData = tools[currentTool];
            const fileInput = document.getElementById('fileInput');
            
            const inputs = {};
            toolData.inputs.forEach(f => {
                const el = document.getElementById(`f_${f.id}`);
                inputs[f.id] = el ? el.value : '';
            });

            if (currentTool === 'reverse' && fileInput.files.length > 0) {
                simulateVisionAnalysis(fileInput.files[0].name, model, inputs);
                return;
            }

            if (currentTool === 'library') {
                fetchLibraryPrompts(inputs);
                return;
            }

            const container = document.getElementById('resultContainer');
            container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;"><i class="fas fa-spinner fa-spin"></i> Generating...</div>';

            setTimeout(() => {
                container.innerHTML = ''; 
                const versions = isAB ? ['Version A', 'Version B', 'Version C'] : ['Result'];
                
                versions.forEach(ver => {
                    const prompt = buildPrompt(currentTool, model, inputs, ver);
                    const box = document.createElement('div');
                    box.className = 'result-box';
                    box.innerHTML = `<div class="ab-tag">${ver}</div>${prompt} <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                    container.appendChild(box);
                });
            }, 800);
        }

        function fetchLibraryPrompts(inputs) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;"><i class="fas fa-book"></i> Searching Vault...</div>';

            setTimeout(() => {
                container.innerHTML = '';
                const box = document.createElement('div');
                box.className = 'result-box';
                
                // Get DNA
                const dnaName = document.getElementById('dnaName').value;
                const dnaLang = document.getElementById('dnaLang').value;
                let context = "";
                if(dnaName) context += `Brand: ${dnaName}\n`;
                if(dnaLang) context += `Output Language: ${dnaLang}\n`;

                let content = `### Category: ${inputs.category}\n### Scenario: ${inputs.scenario}\n${context}\n`;
                
                // Logic placeholders (In a real app, this would be a large switch or DB lookup)
                if (inputs.scenario.includes("Portrait")) content += `/imagine prompt: professional portrait of [Subject]... --v 6.0`;
                else if (inputs.scenario.includes("Logo")) content += `/imagine prompt: minimalist vector logo for ${dnaName || '[Brand]'}... --v 6.0`;
                else content += `[Standard prompt template for ${inputs.scenario} loaded...]`;

                box.innerHTML = `<div class="ab-tag">Vault Result</div>${content} <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                container.appendChild(box);
            }, 500);
        }

        function simulateVisionAnalysis(filename, model, inputs) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            const steps = [`🔍 Reading ${filename}...`, `🧠 Extracting semantics...`, `✨ Generating prompt...`];
            let stepIndex = 0;
            const box = document.createElement('div');
            box.className = 'result-box';
            box.style.color = 'var(--text-sub)';
            container.appendChild(box);

            const interval = setInterval(() => {
                if (stepIndex >= steps.length) {
                    clearInterval(interval);
                    box.style.color = '#10b981';
                    box.innerHTML = `<div class="ab-tag">Analysis Result</div>/imagine prompt: highly detailed shot of ${filename} content...`;
                    box.innerHTML += ` <i class="fas fa-copy" style="position:absolute; right:10px; top:10px; cursor:pointer;" onclick="copyText(this)"></i>`;
                } else {
                    box.innerText = steps[stepIndex];
                    stepIndex++;
                }
            }, 600);
        }

        function buildPrompt(toolKey, model, inputs, ver) {
            // DNA Injection
            const dna = {
                name: document.getElementById('dnaName').value,
                lang: document.getElementById('dnaLang').value,
                role: document.getElementById('dnaRole').value,
                color: document.getElementById('dnaColor').value,
                target: document.getElementById('dnaTarget').value,
                tone: document.getElementById('dnaTone').value,
                neg: document.getElementById('dnaNegative').value
            };

            // Clean inputs
            const cleanInputs = {};
            for (const key in inputs) {
                const val = inputs[key];
                if (val && val.includes('(')) cleanInputs[key] = val.split('(')[0].trim();
                else cleanInputs[key] = val;
            }

            let res = "";
            let context = "";
            if(dna.name) context += `Brand Identity: ${dna.name} | `;
            if(dna.role && toolKey !== 'visual') context += `Role: ${dna.role} | `;
            if(dna.lang && toolKey !== 'visual') context += `Output Language: ${dna.lang} | `;
            if(dna.color) context += `Color Palette: ${dna.color} | `;
            if(dna.target) context += `Target Audience: ${dna.target} | `;
            if(dna.tone) context += `Tone: ${dna.tone} | `;

            if (toolKey === 'email') {
                res = `Subject: [Hook for ${cleanInputs.product}]\n\nHi [Name],\n\n[Context: ${context}]\n[Body using ${cleanInputs.framework}...]\n\n[CTA: ${cleanInputs.cta}]`;
            } else if (toolKey === 'visual') {
                res = `/imagine prompt: ${Object.values(cleanInputs).join(', ')}, ${context} --v 6.0`;
                if(dna.neg) res += ` --no ${dna.neg}`;
            } else {
                res = `### Task: ${tools[toolKey].title}\n### Context: ${context}\n### Inputs: ${JSON.stringify(cleanInputs)}\n### Model: ${model}`;
            }
            return res;
        }

        function copyText(icon) {
            navigator.clipboard.writeText(icon.parentElement.innerText.replace("Copy", "").trim());
            alert("Copied!");
        }

        function resetDNA() {
            document.getElementById('dnaName').value = '';
            document.getElementById('dnaLang').value = '';
            document.getElementById('dnaRole').value = '';
            document.getElementById('dnaColor').value = '';
            document.getElementById('dnaTarget').value = '';
            document.getElementById('dnaTone').value = '';
            document.getElementById('dnaNegative').value = '';
        }

        function magicExpand(id) {
            document.getElementById(id).value += " (AI Optimized)";
        }
    </script>
</body>
</html>
